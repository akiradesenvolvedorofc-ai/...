<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>...</title></head>
<body style="background:#000;margin:0">
<script>
(function(){
  var p = location.pathname;
  var m = p.match(/\/filme\/([\w-]+)/i);
  var s = p.match(/\/serie\/([\w-]+)/i);
  if (m) location.replace('/index.html?id=' + m[1] + '&type=movie');
  else if (s) location.replace('/index.html?id=' + s[1] + '&type=series');
  else location.replace('/admin.html');
})();
</script>
</body></html>
