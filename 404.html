<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redirecionando...</title>
    <style>
        body {
            background: #0f0f1a;
            color: #f59e0b;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(245, 158, 11, 0.2);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        (function() {
            var path = window.location.pathname;
            var match = path.match(/\/filme\/(\d+)/);
            
            if (match) {
                var movieId = match[1];
                window.location.replace('/API.html?id=' + movieId);
            } else {
                window.location.replace('/API.html');
            }
        })();
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Carregando player...</p>
    </div>
</body>
</html>
