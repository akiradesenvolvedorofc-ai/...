<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carregando...</title>
<style>
  body{background:#0a0a14;color:#e53935;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .sp{width:50px;height:50px;border:4px solid rgba(229,57,53,.2);border-top-color:#e53935;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div style="text-align:center">
  <div class="sp"></div>
  <p>Carregando player...</p>
</div>
<script>
(function(){
  var path = window.location.pathname.replace(/\/$/, "");

  // /embed/{id}/{season}/{episode}  →  SÉRIE forçada
  var embedSeries = path.match(/^\/embed\/([\w-]+)\/(\d+)\/(\d+)$/i);
  if (embedSeries) {
    window.location.replace('/API.html?id=' + embedSeries[1] + '&type=series&season=' + embedSeries[2] + '&episode=' + embedSeries[3]);
    return;
  }

  // /serie/{id}/{season}/{episode}  →  SÉRIE forçada
  var serieEp = path.match(/^\/serie\/([\w-]+)\/(\d+)\/(\d+)$/i);
  if (serieEp) {
    window.location.replace('/API.html?id=' + serieEp[1] + '&type=series&season=' + serieEp[2] + '&episode=' + serieEp[3]);
    return;
  }

  // /embed/{id}  →  auto-detectar (filme ou série)
  var embedAny = path.match(/^\/embed\/([\w-]+)$/i);
  if (embedAny) {
    window.location.replace('/API.html?id=' + embedAny[1]);
    return;
  }

  // /filme/{id}  →  FILME forçado
  var filme = path.match(/^\/filme\/([\w-]+)$/i);
  if (filme) {
    window.location.replace('/API.html?id=' + filme[1] + '&type=movie');
    return;
  }

  // /serie/{id}  →  SÉRIE forçada
  var serie = path.match(/^\/serie\/([\w-]+)$/i);
  if (serie) {
    window.location.replace('/API.html?id=' + serie[1] + '&type=series');
    return;
  }

  // fallback
  window.location.replace('/admin.html');
})();
</script>
</body>
</html>
