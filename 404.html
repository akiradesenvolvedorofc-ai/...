<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carregando...</title>
<style>
  body{background:#0a0a14;color:#e53935;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .sp{width:50px;height:50px;border:4px solid rgba(229,57,53,.2);border-top-color:#e53935;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div style="text-align:center">
  <div class="sp"></div>
  <p>Carregando player...</p>
</div>
<script>
(function(){
  var path = window.location.pathname;
  var filme = path.match(/^\/filme\/([\w-]+)\/?$/i);
  var serie = path.match(/^\/serie\/([\w-]+)\/?$/i);

  if (filme) {
    window.location.replace('/index.html?id=' + filme[1] + '&type=movie');
  } else if (serie) {
    window.location.replace('/index.html?id=' + serie[1] + '&type=series');
  } else {
    window.location.replace('/admin.html');
  }
})();
</script>
</body>
</html>
