/* tela de carregamento (KiraFlix Player) */
.splash{position:absolute;inset:0;z-index:40;background:#2b0508;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s ease,visibility .5s}

.splash::after{content:'';position:absolute;inset:0;background:linear-gradient(#000 0,rgba(0,0,0,0) 9%,rgba(0,0,0,0) 90%,rgba(0,0,0,.35) 100%);pointer-events:none}

.splash .b1{width:62%;height:78%;left:-10%;top:14%;background:#e0201f;opacity:.92;animation:bl1 9s ease-in-out infinite alternate}
.splash .b2{width:52%;height:62%;left:24%;top:-14%;background:#c4283a;opacity:.78;animation:bl2 11s ease-in-out infinite alternate}
.splash .b3{width:56%;height:72%;right:-14%;bottom:-22%;background:#8a1018;opacity:.95;animation:bl3 10s ease-in-out infinite alternate}

@keyframes bl2{to{transform:translate(-12%,14%) scale(1.12)}}

<script>
// ==========================================
// CONFIGURAÇÕES DA API E WORKER
// ==========================================
const WORKER_URL = "https://wandering-lake-8698.desantosinouea.workers.dev/?url=";
const PHP_API = "https://mgeb.space/mp4.php"; // Caminho do seu arquivo PHP

// Elementos de UI
const video = document.getElementById('v');
const player = document.getElementById('player');
const ldr = document.getElementById('ldr');
const subOverlay = document.getElementById('sub-overlay');
const subSpan = subOverlay.querySelector('span');

let hls = null;
let currentSubtitles = [];
let currentQualities = [];
let activeSubUrl = '';

// Obter URL via parâmetro GET (?url=...)
const urlParams = new URLSearchParams(window.location.search);
// Se não vier nenhuma URL, usa o exemplo do Black Clover
const targetUrl = urlParams.get('url') || "https://www3.dramasfree.com/pt/detail/drama/y2xUxlOolavqBVYSVV9dC-Black-Clover-Season-1/1"; 

// ==========================================
// LÓGICA PRINCIPAL (FETCH PHP + PLAYER)
// ==========================================

async function loadData(url) {
  ldr.style.display = 'block';
  ldr.querySelector('.ldr-t').innerText = 'Buscando dados...';
  
  try {
    // Chama o PHP para extrair a série inteira + tracks do episódio atual
    const res = await fetch(`${PHP_API}?url=${encodeURIComponent(url)}&fill=1&tracks=1`);
    const json = await res.json();
    
    if (!json.success) throw new Error(json.error || "Erro na API");

    const data = json.data;
    
    // 1. Preencher Episódios
    const epGrid = document.getElementById('ep-grid');
    epGrid.innerHTML = '';
    if (data.seasons && data.seasons.length > 0) {
      data.seasons[0].episodes.forEach(ep => {
        const btn = document.createElement('button');
        btn.className = 'ep' + (ep.url === url ? ' sel' : '');
        btn.innerText = ep.episode;
        btn.onclick = () => {
          window.location.href = `?url=${encodeURIComponent(ep.url)}`;
        };
        epGrid.appendChild(btn);
      });
    }

    // 2. Preencher Qualidades e Legendas
    if (data.episode_tracks) {
      currentQualities = data.episode_tracks.qualities || [];
      subtitlesData = data.episode_tracks.subtitles || [];
      
      renderQualities();
      renderSubtitles();
      
      // 3. Iniciar o Vídeo (padrão: primeira qualidade ou melhor disponível)
      if (currentQualities.length > 0) {
        playStream(currentQualities[0].url, currentQualities[0].label);
      } else {
        alert("Nenhum link de vídeo .m3u8 encontrado neste episódio.");
        ldr.style.display = 'none';
      }
    } else {
      ldr.style.display = 'none';
    }

  } catch (err) {
    console.error(err);
    alert("Erro ao carregar dados: " + err.message);
    ldr.style.display = 'none';
  }
}

function renderQualities() {
  const lq = document.getElementById('l-q');
  lq.innerHTML = '';
  currentQualities.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (i === 0 ? ' sel' : '');
    btn.innerText = q.label;
    btn.onclick = () => {
      document.querySelectorAll('#l-q .opt').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      document.getElementById('o-q-t').innerText = `Qualidade (${q.label})`;
      document.getElementById('p-q').classList.remove('open');
      playStream(q.url, q.label);
    };
    lq.appendChild(btn);
  });
}

function renderSubtitles() {
  const lc = document.getElementById('l-c');
  lc.innerHTML = '';
  
  // Opção para desligar
  const offBtn = document.createElement('button');
  offBtn.className = 'opt';
  offBtn.innerText = 'Desativado';
  offBtn.onclick = () => {
    document.querySelectorAll('#l-c .opt').forEach(b => b.classList.remove('sel'));
    offBtn.classList.add('sel');
    subOverlay.style.display = 'none';
    activeSubUrl = '';
    document.getElementById('p-c').classList.remove('open');
  };
  lc.appendChild(offBtn);

  subtitlesData.forEach(sub => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerText = `${sub.label} (${sub.language})`;
    btn.onclick = () => {
      document.querySelectorAll('#l-c .opt').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      document.getElementById('p-c').classList.remove('open');
      loadSubtitle(sub.url);
    };
    lc.appendChild(btn);
  });
}

// ==========================================
// CONTROLES DE PLAYER E HLS.JS
// ==========================================

function playStream(m3u8Url, label) {
  ldr.style.display = 'block';
  ldr.querySelector('.ldr-t').innerText = 'Carregando vídeo...';
  
  // Usa o Cloudflare Worker para contornar CORS do m3u8
  const proxiedUrl = WORKER_URL + encodeURIComponent(m3u8Url);
  
  if (Hls.isSupported()) {
    if (hls) hls.destroy();
    hls = new Hls({
      maxBufferLength: 30,
      enableWorker: true
    });
    hls.loadSource(proxiedUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(e => console.log("Autoplay blocked", e));
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        console.error("HLS Error:", data);
        ldr.style.display = 'none';
        alert("Erro ao reproduzir. O link pode ter expirado.");
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari nativo
    video.src = proxiedUrl;
    video.addEventListener('loadedmetadata', () => video.play());
  }
}

async function loadSubtitle(srtUrl) {
  // Usa o Worker para puxar a legenda (evita CORS)
  const proxiedUrl = WORKER_URL + encodeURIComponent(srtUrl);
  try {
    const res = await fetch(proxiedUrl);
    if (!res.ok) throw new Error("Falha ao baixar legenda");
    let text = await res.text();
    
    // Converte SRT para VTT básico
    text = "WEBVTT\n\n" + text.replace(/\r+/g, '').replace(/(\d+)\n(\d{2}:\d{2}:\d{2}),(\d{3}) --> (\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1\n$2.$3 --> $4.$5');
    
    // Cria Blob URL
    const blob = new Blob([text], { type: 'text/vtt' });
    const url = URL.createObjectURL(blob);
    
    // Configura track
    let track = video.querySelector('track');
    if (!track) {
      track = document.createElement('track');
      track.kind = 'subtitles';
      track.label = 'Legend';
      track.default = true;
      video.appendChild(track);
    }
    track.src = url;
    
    // Garante que o overlay nativo não apareça (usamos o nosso customizado)
    video.textTracks[0].mode = 'hidden';
    
    const t = video.textTracks[0];
    t.oncuechange = () => {
      const cue = t.activeCues[0];
      if (cue) {
        subSpan.innerText = cue.text;
        subOverlay.style.display = 'block';
      } else {
        subOverlay.style.display = 'none';
      }
    };
    
    activeSubUrl = srtUrl;
    
  } catch (e) {
    console.error("Erro legenda:", e);
    alert("Não foi possível carregar a legenda. Verifique o Worker.");
  }
}

// ==========================================
// CONTROLES BÁSICOS DE UI (PLAY, PAUSE, SEEK, FULLSCREEN)
// ==========================================

document.getElementById('f-play').addEventListener('click', togglePlay);
document.getElementById('c-play').addEventListener('click', togglePlay);
document.getElementById('c-big').addEventListener('click', togglePlay);
document.getElementById('gest').addEventListener('click', togglePlay);

video.addEventListener('play', () => { player.classList.add('playing'); player.classList.remove('paused'); });
video.addEventListener('pause', () => { player.classList.remove('playing'); player.classList.add('paused'); });
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('waiting', () => { player.classList.add('loading'); });
video.addEventListener('playing', () => { player.classList.remove('loading'); ldr.style.display = 'none'; });
video.addEventListener('canplay', () => { ldr.style.display = 'none'; });

function togglePlay() {
  if (video.paused) video.play(); else video.pause();
}

function updateProgress() {
  if(video.duration) {
    const pct = (video.currentTime / video.duration) * 1000;
    document.getElementById('f-seek').value = pct;
    document.getElementById('c-seek').value = pct;
    document.getElementById('f-tl').innerText = formatTime(video.currentTime);
    document.getElementById('f-tr').innerText = formatTime(video.duration);
    document.getElementById('c-time').innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  }
}

function formatTime(s) {
  if(isNaN(s)) return "00:00";
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if(h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}

document.getElementById('f-seek').addEventListener('input', (e) => {
  if(video.duration) video.currentTime = (e.target.value / 1000) * video.duration;
});
document.getElementById('c-seek').addEventListener('input', (e) => {
  if(video.duration) video.currentTime = (e.target.value / 1000) * video.duration;
});
document.getElementById('f-fs').addEventListener('click', () => {
  if (!document.fullscreenElement) player.requestFullscreen();
  else document.exitFullscreen();
});
document.getElementById('c-fs').addEventListener('click', () => {
  if (!document.fullscreenElement) player.requestFullscreen();
  else document.exitFullscreen();
});
document.getElementById('f-rew').addEventListener('click', () => video.currentTime -= 10);
document.getElementById('f-fwd').addEventListener('click', () => video.currentTime += 10);

// Abrir e fechar painéis
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.target.closest('.panel').classList.remove('open');
    player.classList.remove('panel-open');
  });
});

document.getElementById('o-q').addEventListener('click', () => { document.getElementById('p-q').classList.add('open'); player.classList.add('panel-open'); });
document.getElementById('o-c').addEventListener('click', () => { document.getElementById('p-c').classList.add('open'); player.classList.add('panel-open'); });
document.getElementById('o-e').addEventListener('click', () => { document.getElementById('p-e').classList.add('open'); player.classList.add('panel-open'); });

document.getElementById('btn-sub-settings').addEventListener('click', () => {
  document.getElementById('p-c').classList.remove('open');
  document.getElementById('p-cs').classList.add('open');
});

// Configuração de Legendas (Tamanho e Posição)
document.getElementById('sl-size').addEventListener('input', (e) => {
  subSpan.style.fontSize = e.target.value + 'px';
});
document.getElementById('sl-pos').addEventListener('input', (e) => {
  subOverlay.style.bottom = e.target.value + '%';
});

// Inicialização do Player
loadData(targetUrl);

</script>
