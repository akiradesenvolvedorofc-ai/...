<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraFlix Player</title>

    <!-- Video.js Base -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <!-- Video.js Plugins: Legendas, Qualidade, etc. -->
    <link href="https://cdn.jsdelivr.net/npm/videojs-vtt-thumbnails@0.0.1/dist/videojs-vtt-thumbnails.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/videojs-vtt-thumbnails@0.0.1/dist/videojs-vtt-thumbnails.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-hotkeys@0.2.28/videojs.hotkeys.min.js"></script>

    <style>
        /* Reset e Fundo */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top left, #1a1a2e, #0f0f1a);
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Container Principal */
        .kira-container {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
        }

        /* --- ESTILO GLASSMORPHISM DO PLAYER --- */
        .video-js {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #000;
            /* Efeito de vidro no player */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Controles com efeito de vidro */
        .video-js .vjs-control-bar {
            background: rgba(20, 20, 30, 0.6) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            height: 50px;
            align-items: center;
        }

        /* Botão de Play Grande */
        .video-js .vjs-big-play-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 76px;
            font-size: 32px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .video-js .vjs-big-play-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            border-color: #f59e0b;
        }

        /* Barra de Progresso */
        .video-js .vjs-play-progress {
            background: linear-gradient(90deg, #f59e0b, #f97316) !important;
            border-radius: 0 4px 4px 0;
        }
        .video-js .vjs-load-progress {
            background: rgba(255, 255, 255, 0.2) !important;
            border-radius: 4px;
        }
        .video-js .vjs-progress-holder {
            height: 6px !important;
            border-radius: 4px;
            margin: 0 10px;
        }

        /* Botões e Ícones */
        .video-js .vjs-button > .vjs-icon-placeholder:before {
            line-height: 50px;
        }
        .video-js .vjs-control:hover .vjs-icon-placeholder {
            color: #f59e0b;
        }

        /* Menu de Configurações (Legendas, Qualidade) */
        .video-js .vjs-menu-content {
            background: rgba(20, 20, 30, 0.9) !important;
            backdrop-filter: blur(20px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .video-js .vjs-menu li {
            padding: 8px 16px;
        }
        .video-js .vjs-menu li:hover {
            background: rgba(245, 158, 11, 0.2) !important;
        }

        /* Legendas */
        .vjs-text-track-display {
            font-family: 'Inter', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .vjs-text-track-cue {
            background: rgba(0, 0, 0, 0.7) !important;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 1.1rem !important;
            line-height: 1.5 !important;
        }

        /* --- PAINEL DE ADMINISTRAÇÃO (ADICIONAR FILMES) --- */
        .kira-admin {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            margin-top: 2rem;
        }

        .kira-admin h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #f59e0b, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .kira-form-group {
            margin-bottom: 1.2rem;
        }

        .kira-form-group label {
            display: block;
            font-size: 0.85rem;
            color: #a1a1aa;
            margin-bottom: 0.4rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .kira-form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .kira-form-group input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .kira-form-group input::placeholder {
            color: #52525b;
        }

        .kira-btn {
            background: linear-gradient(90deg, #f59e0b, #f97316);
            color: #000;
            font-weight: 700;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .kira-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
        }

        /* Seção de Resultados/Preview */
        .kira-result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .kira-result h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #f59e0b;
        }

        .kira-result p {
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-bottom: 0.5rem;
        }

        .kira-result .url-box {
            background: #000;
            padding: 0.8rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #f59e0b;
            word-break: break-all;
            border: 1px solid rgba(245, 158, 11, 0.3);
            margin-top: 0.5rem;
        }

        /* Ocultar elementos desnecessários */
        .video-js .vjs-poster { display: none; }
    </style>
</head>
<body>

    <!-- PLAYER PRINCIPAL -->
    <div class="kira-container">
        <video
            id="kira-player"
            class="video-js vjs-big-play-centered"
            controls
            preload="auto"
            poster=""
            playsinline
        >
            <!-- A fonte será injetada via JavaScript -->
            <p class="vjs-no-js">
                Para visualizar este vídeo, por favor, ative o JavaScript.
            </p>
        </video>
    </div>

    <!-- PAINEL DE ADMINISTRAÇÃO / GERADOR DE PÁGINA -->
    <div class="kira-admin">
        <h2>⚙️ Gerador de Player KiraFlix</h2>
        <p style="color: #a1a1aa; font-size: 0.9rem; margin-bottom: 1.5rem;">
            Insira os dados do filme ou série para gerar a URL e o código do player automaticamente.
        </p>

        <!-- Formulário -->
        <div class="kira-form-group">
            <label for="tmdb-id">ID do TMDB (The Movie Database)</label>
            <input type="text" id="tmdb-id" placeholder="Ex: 969681 (Spider-Man: Brand New Day)" value="969681">
            <p style="font-size: 0.75rem; color: #52525b; margin-top: 0.3rem;">
                Você pode encontrar o ID no site do TMDB, na URL do filme.
            </p>
        </div>

        <div class="kira-form-group">
            <label for="video-source">URL da Fonte de Vídeo (MP4 ou HLS)</label>
            <input type="text" id="video-source" placeholder="https://exemplo.com/filme.mp4" 
                   value="https://mgeb.space/mp4.php?url=https://es.cuevana4br.com/pt/detail/movie/iswnnqdfuZdhcRaFZNeuO-Spider-Man-Brand-New-Day">
        </div>

        <div class="kira-form-group">
            <label for="subtitle-url">URL da Legenda (Opcional - .vtt ou .srt)</label>
            <input type="text" id="subtitle-url" placeholder="https://exemplo.com/legenda.vtt">
        </div>

        <button class="kira-btn" onclick="gerarPlayer()">🚀 Gerar Player e URL</button>

        <!-- Área de Resultado -->
        <div class="kira-result" id="resultado">
            <h3>✅ Player Gerado com Sucesso!</h3>
            <p><strong>URL da Página:</strong></p>
            <div class="url-box" id="url-gerada"></div>
            <p style="margin-top: 1rem;"><strong>Código para incorporar em qualquer site:</strong></p>
            <div class="url-box" id="codigo-incorporar"></div>
        </div>
    </div>

    <script>
        // --- LÓGICA DO PLAYER VIDEO.JS ---
        document.addEventListener('DOMContentLoaded', function() {
            const player = videojs('kira-player', {
                fluid: true,
                responsive: true,
                playbackRates: [0.5, 1, 1.5, 2],
                controlBar: {
                    children: [
                        'playToggle',
                        'volumePanel',
                        'currentTimeDisplay',
                        'progressControl',
                        'durationDisplay',
                        'pictureInPictureToggle',
                        'qualitySelector', // Se usar plugin
                        'subsCapsButton',
                        'settingsMenu',
                        'fullscreenToggle'
                    ]
                },
                html5: {
                    vhs: {
                        overrideNative: true // Para HLS
                    }
                }
            });

            // Ativa atalhos de teclado (espaço, setas, etc.)
            player.hotkeys({
                volumeStep: 0.1,
                seekStep: 5,
                enableModifiersForNumbers: false
            });

            // Define a fonte inicial padrão (Spider-Man)
            player.src({
                src: 'https://mgeb.space/mp4.php?url=https://es.cuevana4br.com/pt/detail/movie/iswnnqdfuZdhcRaFZNeuO-Spider-Man-Brand-New-Day',
                type: 'video/mp4'
            });

            // Função para buscar legendas (exemplo conceitual, a API real precisa de chave)
            // Esta função é um exemplo de como você poderia integrar a API OpenSubtitles
            async function buscarLegendas(imdbId) {
                // A API do OpenSubtitles requer uma chave (Api-Key) no cabeçalho.
                // Você pode obter uma gratuitamente em https://www.opensubtitles.com/
                // const response = await fetch(`https://api.opensubtitles.com/api/v1/subtitles?imdb_id=${imdbId}`, {
                //     headers: {
                //         'Api-Key': 'wo7fkIUiWzDG9jdN8b2kDkXEVm1VGc0O',
                //         'Content-Type': 'application/json'
                //     }
                // });
                // const data = await response.json();
                // Retornaria as legendas disponíveis.
                console.log('Buscando legendas para o IMDB ID:', imdbId);
                // Exemplo de retorno fictício para demonstração
                return [
                    { lang: 'pt-br', url: 'https://exemplo.com/legenda-ptbr.vtt', label: 'Português (BR)' }
                ];
            }

            // Expor o player globalmente para o gerador
            window.kiraPlayer = player;
            window.buscarLegendas = buscarLegendas;
        });

        // --- LÓGICA DO GERADOR DE PÁGINA (ADMIN) ---
        async function gerarPlayer() {
            const tmdbId = document.getElementById('tmdb-id').value.trim();
            const videoSource = document.getElementById('video-source').value.trim();
            const subtitleUrl = document.getElementById('subtitle-url').value.trim();
            const resultadoDiv = document.getElementById('resultado');
            const urlGeradaDiv = document.getElementById('url-gerada');
            const codigoIncorporarDiv = document.getElementById('codigo-incorporar');

            if (!tmdbId || !videoSource) {
                alert('Por favor, preencha o ID do TMDB e a URL do vídeo.');
                return;
            }

            // 1. Atualiza o player na hora com a nova fonte
            if (window.kiraPlayer) {
                window.kiraPlayer.src({ src: videoSource, type: 'video/mp4' });
                
                // Se uma legenda foi fornecida, adiciona ao player
                if (subtitleUrl) {
                    window.kiraPlayer.addRemoteTextTrack({
                        kind: 'subtitles',
                        src: subtitleUrl,
                        srclang: 'pt',
                        label: 'Português',
                        default: true
                    }, false);
                }
            }

            // 2. Gera a URL "amigável" baseada no domínio KiraFlix
            // Supondo que seu domínio seja kiraflix.qd.je
            const baseUrl = 'https://kiraflix.qd.je';
            const urlAmigavel = `${baseUrl}/filme/${tmdbId}`;
            
            // 3. Gera o código de incorporação (iframe ou script)
            const codigoIframe = `<iframe src="${baseUrl}/embed/${tmdbId}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;

            // 4. Exibe os resultados
            urlGeradaDiv.textContent = urlAmigavel;
            codigoIncorporarDiv.textContent = codigoIframe;
            resultadoDiv.style.display = 'block';

            // 5. (Opcional) Buscar legendas automaticamente se tiver a chave da API
            // const legendas = await window.buscarLegendas(tmdbId);
            // console.log('Legendas encontradas:', legendas);
        }
    </script>
</body>
</html>
