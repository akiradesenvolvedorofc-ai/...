<!DOCTYPE html>
<html lang="pt-BR" data-theme="kira">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b14">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data: blob:; media-src * blob:; frame-src *; connect-src 'self' https://api.themoviedb.org https://*.supabase.co wss://*.supabase.co; base-uri 'none'; object-src 'none'">
<title>KiraFlix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b14;--bg2:#10121f;--card:#161828;--line:rgba(255,255,255,.08);--tx:#f4f5fb;--mut:#9aa0b8;--a:#e11d2e;--a2:#ff4d5e;--glow:rgba(225,29,46,.45);--b1:rgba(225,29,46,.16);--b2:rgba(90,70,220,.10);--glass:rgba(14,16,28,.72);--sh:0 18px 44px rgba(0,0,0,.55);--r:16px}
[data-theme=midnight]{--bg:#080a1a;--bg2:#0e1128;--card:#151936;--a:#6366f1;--a2:#a78bfa;--glow:rgba(99,102,241,.5);--b1:rgba(99,102,241,.2);--b2:rgba(167,139,250,.1)}
[data-theme=aurora]{--bg:#06100f;--bg2:#0a1917;--card:#0f2220;--a:#10b981;--a2:#22d3ee;--glow:rgba(16,185,129,.45);--b1:rgba(16,185,129,.16);--b2:rgba(34,211,238,.1)}
[data-theme=sunset]{--bg:#130a0c;--bg2:#1d1013;--card:#26151a;--a:#f97316;--a2:#ec4899;--glow:rgba(249,115,22,.45);--b1:rgba(249,115,22,.17);--b2:rgba(236,72,153,.12)}
[data-theme=sakura]{--bg:#140a12;--bg2:#1e1019;--card:#291524;--a:#ec4899;--a2:#f9a8d4;--glow:rgba(236,72,153,.45);--b1:rgba(236,72,153,.17);--b2:rgba(249,168,212,.08)}
[data-theme=gold]{--bg:#0b0a07;--bg2:#15130c;--card:#1e1b10;--a:#d4a017;--a2:#f5d061;--glow:rgba(212,160,23,.4);--b1:rgba(212,160,23,.14);--b2:rgba(245,208,97,.06)}
[data-theme=ocean]{--bg:#060d16;--bg2:#0b1724;--card:#102134;--a:#0ea5e9;--a2:#38bdf8;--glow:rgba(14,165,233,.45);--b1:rgba(14,165,233,.17);--b2:rgba(56,189,248,.08)}
[data-theme=light]{--bg:#f3f4f9;--bg2:#fff;--card:#e8eaf3;--line:rgba(0,0,0,.09);--tx:#14151f;--mut:#5d6380;--glass:rgba(255,255,255,.82);--sh:0 18px 40px rgba(0,0,0,.16);--b1:rgba(225,29,46,.1);--b2:rgba(90,70,220,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;min-height:100vh;font-size:14px;transition:background .4s}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 50% at 90% -5%,var(--b1),transparent 70%),radial-gradient(50% 45% at -5% 45%,var(--b2),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
i[data-lucide],svg.lucide{width:1.15em;height:1.15em;stroke-width:2;flex:none;vertical-align:middle}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.logo{height:30px;cursor:pointer;display:block;filter:drop-shadow(0 4px 10px var(--glow));transition:.3s}
.logo:hover{transform:scale(1.05)}
.grad{background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 7px transparent}}
@keyframes sk{to{background-position:-200% 0}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.sk{background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sk 1.3s infinite}
/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:60;padding:8px 12px;transition:.3s}
header.sc{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.hb{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:6px}
.hb .sp{flex:1}
.ib{position:relative;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;color:var(--mut);transition:.2s;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.ib:hover{color:var(--tx);border-color:var(--a)}
.ib.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent}
.av{width:36px;height:36px;border-radius:12px;background-size:cover;background-position:center;border:2px solid var(--line);cursor:pointer;flex:none}
.nv{max-width:1500px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.nv::-webkit-scrollbar{display:none}
.nv button{flex:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mut);background:var(--glass);border:1px solid var(--line);display:flex;gap:6px;align-items:center;transition:.2s;backdrop-filter:blur(10px)}
.nv button:hover{color:var(--tx)}
.nv button.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent;box-shadow:0 6px 18px var(--glow)}
@media(min-width:900px){header{padding:10px 28px}.hb{gap:10px}.nv{margin:0;position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:none}.logo{height:34px}}
.pop{position:fixed;z-index:90;min-width:210px;max-width:92vw;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--sh);animation:up .2s;display:none}
.pop.on{display:block}
.pop .it{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-weight:500;text-align:left;color:var(--tx)}
.pop .it:hover,.pop .it.sel{background:var(--line)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px}
.sw button{height:38px;border-radius:12px;border:2px solid transparent;transition:.2s}
.sw button:hover{transform:scale(1.08)}.sw button.on{border-color:var(--tx)}
.kid{font-size:11px;background:#22c55e;color:#04210f;border-radius:6px;padding:1px 6px;font-weight:700}
/* HERO CAROUSEL */
.hero{position:relative;height:min(78vh,640px);min-height:430px;overflow:hidden;touch-action:pan-y}
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
.sl.on{opacity:1;visibility:visible}
.sl .bg{position:absolute;inset:0;background-size:cover;background-position:center 18%}
.sl.on .bg{animation:kb 14s linear infinite alternate}
.sl .tv{position:absolute;inset:0;opacity:0;transition:opacity 1s;pointer-events:none;overflow:hidden}
.sl .tv.on{opacity:1}
.sl .tv iframe{position:absolute;top:50%;left:50%;width:max(100%,177.78vh);height:max(100%,56.25vw);transform:translate(-50%,-50%);border:0}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,var(--bg) 1%,transparent 50%),linear-gradient(90deg,rgba(6,7,14,.85),rgba(6,7,14,.25) 60%,transparent),linear-gradient(180deg,rgba(6,7,14,.6),transparent 22%)}
.hc{position:absolute;z-index:3;left:max(18px,4vw);bottom:92px;max-width:520px;color:#fff;animation:up .7s}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:600;color:#fff;backdrop-filter:blur(8px)}
.hc .chip{margin-bottom:12px}
.hc h1{font-family:Outfit,sans-serif;font-size:clamp(26px,5vw,48px);line-height:1.05;font-weight:800;margin-bottom:10px;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.hc .tl{max-width:min(300px,62vw);max-height:100px;object-fit:contain;object-position:left bottom;margin-bottom:10px;filter:drop-shadow(0 4px 18px rgba(0,0,0,.7));display:block}
.mt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#d9dcec;margin-bottom:10px}
.mt .st{display:inline-flex;gap:4px;align-items:center;color:#fbbf24;font-weight:700}
.hc p{color:#cfd3e4;line-height:1.5;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;font-size:13.5px;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;box-shadow:0 8px 22px var(--glow)}
.btn.w{background:#fff;color:#111}
.btn.g{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}
.btn.s{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn.d{background:#ef4444;color:#fff}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn:disabled{opacity:.5;pointer-events:none}
.hn{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:#fff;display:none;place-items:center;backdrop-filter:blur(8px);transition:.2s}
.hn:hover{background:var(--a)}.hn.l{left:14px}.hn.r{right:14px}
@media(hover:hover) and (min-width:900px){.hn{display:grid}}
.hbar{position:absolute;z-index:5;left:max(18px,4vw);right:max(18px,4vw);bottom:26px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s;display:block}
.dots i.on{background:linear-gradient(90deg,var(--a),var(--a2));width:34px}
.ths{display:none;gap:8px}
.ths div{width:96px;height:54px;border-radius:10px;background-size:cover;background-position:center;border:2px solid transparent;opacity:.6;cursor:pointer;transition:.25s}
.ths div:hover,.ths div.on{opacity:1;border-color:#fff;transform:translateY(-3px)}
@media(min-width:700px){.ths{display:flex}}
.mute{position:absolute;z-index:5;right:max(18px,4vw);top:90px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);display:none;place-items:center;color:#fff}
.mute.show{display:grid}

/* ROWS + CARDS */
main{position:relative;margin-top:-34px;z-index:5;padding-bottom:40px}
.sec{margin-top:18px;animation:up .5s both}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 max(16px,3vw)}
.sh h2{font-family:Outfit,sans-serif;font-size:clamp(16px,2vw,21px);font-weight:700;display:flex;align-items:center;gap:8px}
.sh h2::before{content:"";width:4px;height:18px;border-radius:4px;background:linear-gradient(var(--a),var(--a2))}
.sh span{color:var(--mut);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:4px}.sh span:hover{color:var(--tx)}
.rw{position:relative}
.row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:18px max(16px,3vw) 26px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.nav{position:absolute;top:18px;bottom:26px;width:46px;z-index:8;display:none;place-items:center;color:var(--tx);opacity:0;transition:.25s}
.nav.l{left:0;background:linear-gradient(90deg,var(--bg),transparent)}.nav.r{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
@media(hover:hover) and (min-width:900px){.nav{display:grid}.rw:hover .nav{opacity:1}}
.card{position:relative;flex:none;width:clamp(108px,29vw,158px);aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;scroll-snap-align:start;transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s,border-color .3s;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.card img.ld{opacity:1}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 45%);opacity:0;transition:.3s;pointer-events:none}
.card:hover,.card.touch{transform:scale(1.13);z-index:20;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 2px var(--a),0 0 28px var(--glow);border-color:transparent}
.card:hover::after,.card.touch::after{opacity:1}
.card .pl{position:absolute;z-index:3;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.3s}
.card:hover .pl,.card.touch .pl{opacity:1;transform:none}
.bd{position:absolute;top:7px;left:7px;z-index:4;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.b{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:10.5px;font-weight:700;color:#fff;backdrop-filter:blur(6px);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.b i,.b svg{width:11px!important;height:11px!important}
.b.novo{background:linear-gradient(135deg,#10b981,#22d3ee)}
.b.lanc{background:linear-gradient(135deg,var(--a),var(--a2))}
.b.breve{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#2b1800}
.b.alta{background:linear-gradient(135deg,#ef4444,#f97316);animation:pulse 2s infinite}
.b.kind{background:rgba(10,11,20,.75)}
.rt{position:absolute;z-index:4;right:7px;bottom:7px;background:rgba(10,11,20,.8);border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;color:#fbbf24;display:flex;gap:3px;align-items:center}
.card .x{position:absolute;top:6px;right:6px;z-index:6;width:26px;height:26px;border-radius:50%;background:rgba(10,11,20,.85);display:grid;place-items:center;color:#fff}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2);z-index:4}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}
.cw{flex:none;width:clamp(108px,29vw,158px);scroll-snap-align:start}.cw .card{width:100%}.cap{font-size:11.5px;color:var(--mut);margin-top:6px}
.t10 .item{position:relative;flex:none;display:flex;align-items:flex-end;scroll-snap-align:start}
.t10 .num{font-family:Outfit,sans-serif;font-weight:800;font-size:clamp(84px,14vw,150px);line-height:.8;color:transparent;-webkit-text-stroke:2px var(--mut);opacity:.5;margin-right:-22px;user-select:none;transition:.3s}
.t10 .item:hover .num{-webkit-text-stroke-color:var(--a2);opacity:1}
.t10 .card{z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;padding:0 max(16px,3vw)}
.grid .card{width:100%}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}}
.page{padding:108px 0 40px;min-height:100vh;animation:fade .4s}
.page>h2{font-family:Outfit,sans-serif;font-size:22px;padding:0 max(16px,3vw);margin-bottom:16px;display:flex;gap:10px;align-items:center}
.empty{padding:30px max(16px,3vw);color:var(--mut);text-align:center}
.empty i{width:34px!important;height:34px!important;display:block;margin:0 auto 10px;opacity:.6}
@media(max-width:899px){.page{padding-top:112px}}
/* OVERLAYS */
.ov{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(20px);transition:.35s}
.ov.on{opacity:1;visibility:visible;transform:none}
.dh{position:relative;min-height:46vh;background-size:cover;background-position:center top}
.dh::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0,rgba(8,9,16,.5) 58%,rgba(8,9,16,.12))}
.top{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}
.pill{padding:9px 15px;border-radius:999px;background:rgba(10,11,20,.72);border:1px solid rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13px;backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px}
.circ{width:40px;height:40px;border-radius:50%;background:rgba(10,11,20,.72);border:1px solid rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:18px;backdrop-filter:blur(10px);transition:.2s}
.circ:hover{background:var(--a)}
.di{position:relative;z-index:3;margin-top:-20vh;padding:0 max(18px,5vw);max-width:1100px;animation:up .5s}
.di .tl{max-width:min(300px,70vw);max-height:120px;object-fit:contain;object-position:left bottom;display:block;margin-bottom:14px;filter:drop-shadow(0 4px 18px #000)}
.di h1{font-family:Outfit,sans-serif;font-size:clamp(28px,5vw,46px);font-weight:800;line-height:1.05;margin-bottom:12px;color:#fff}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips span{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:12px}
.chips .age{background:#f97316}.chips .age.l{background:#22c55e}.chips .age.x{background:#ef4444}
.dm{color:#d3d6e6;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dm i.dt{width:5px;height:5px;border-radius:50%;background:var(--mut)}
[data-theme=light] .dm,[data-theme=light] .ds{color:#2c2f42}
.ds{font-size:14.5px;line-height:1.6;color:#dde0ee;max-width:720px;margin-bottom:18px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.acts .btn.p{padding:13px 28px;font-size:14.5px;letter-spacing:.8px}
.acts .circ{width:46px;height:46px;background:var(--card);border-color:var(--line);color:var(--tx)}
.acts .circ.on{background:var(--a);color:#fff}
.dtab{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 max(18px,5vw);max-width:1100px;overflow-x:auto;scrollbar-width:none}
.dtab button{padding:12px 2px;font-weight:700;letter-spacing:1.2px;font-size:13px;color:var(--mut);text-transform:uppercase;position:relative;white-space:nowrap}
.dtab button.on{color:var(--tx)}
.dtab button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:3px}
.pn{padding:20px max(18px,5vw) 60px;max-width:1100px;animation:fade .4s}
.pn .grid{padding:0}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 24px;margin-bottom:24px}
.dl small{display:block;color:var(--mut);font-weight:700;letter-spacing:1.2px;font-size:11px;text-transform:uppercase;margin-bottom:4px}
.dl div{font-size:15px;font-weight:600}
.cast{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cast div{flex:none;width:92px;text-align:center}
.cast img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--card);margin-bottom:8px;transition:.25s;border:2px solid var(--line)}
.cast div:hover img{transform:scale(1.08);border-color:var(--a)}
.cast b{display:block;font-size:12.5px}.cast span{font-size:11.5px;color:var(--mut)}
.pn h3{font-family:Outfit,sans-serif;font-size:19px;margin-bottom:12px}
.vid{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* EPISODES */
.eph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sel{padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;outline:none}
.sel:focus{border-color:var(--a)}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;transition:.25s}
.ep:hover{border-color:var(--a);transform:translateX(4px);background:var(--card)}
.ep .n{width:30px;height:30px;border-radius:50%;background:var(--b1);color:var(--a2);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.ep img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:var(--card);flex:none}
.ep .t{flex:1;min-width:0}.ep .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ep .t span{font-size:11.5px;color:var(--mut)}
.ep .go{color:var(--a2)}
.mini{font-size:11.5px;padding:5px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--mut);display:inline-flex;gap:4px;align-items:center}
/* PLAYER */
.player{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}
.player.on{display:flex}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(#000d,#0000);position:absolute;top:0;left:0;right:0;z-index:3;color:#fff;flex-wrap:wrap}
.ph .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.srv button{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
.srv button.on{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent}
.pb{flex:1;position:relative;background:#000}
.pb iframe,.pb video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.lock{position:absolute;inset:0;z-index:2;display:grid;place-items:end center;padding-bottom:70px;background:transparent}
.lock span{background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;display:flex;gap:6px;align-items:center;backdrop-filter:blur(8px)}
.pnav{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px;background:linear-gradient(#0000,#000c)}
/* MODAL / FORMS */
.md{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:none;place-items:center;padding:14px;overflow-y:auto}
.md.on{display:grid;animation:fade .25s}
.mb{width:min(460px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--sh);animation:up .3s;max-height:92vh;overflow-y:auto}
.mb.w{width:min(640px,100%)}
.mb h3{font-family:Outfit,sans-serif;font-size:20px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.mb .sub{color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:12px;font-weight:600;color:var(--mut)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none;font-size:14px;transition:.2s}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--b1)}
.pw{position:relative}.pw .inp{padding-right:44px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;color:var(--mut);display:grid;place-items:center}
.meter{display:flex;gap:4px;margin-top:6px}.meter i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:.3s}
.mlab{font-size:11.5px;font-weight:600;margin-top:4px}
.tabs2{display:flex;gap:4px;padding:4px;background:var(--card);border-radius:14px;margin-bottom:14px}
.tabs2 button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;justify-content:center}
.tabs2 button.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
.lnk{color:var(--a2);font-weight:600;cursor:pointer;font-size:13px}.lnk:hover{text-decoration:underline}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.note{font-size:12px;color:var(--mut);padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);line-height:1.5;margin-bottom:12px;display:flex;gap:8px}
.note.warn{border-color:#f59e0b;color:#fbbf24}
/* AUTH + PROFILES */
.scr{position:fixed;inset:0;z-index:150;background:var(--bg);overflow-y:auto;display:none}
.scr.on{display:block;animation:fade .4s}
.scr::before{content:"";position:fixed;inset:0;background:radial-gradient(50% 40% at 50% 0,var(--b1),transparent 70%),radial-gradient(40% 35% at 90% 100%,var(--b2),transparent 70%);pointer-events:none}
.auth{position:relative;min-height:100%;display:grid;place-items:center;padding:20px}
.ac{width:min(400px,100%);background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:26px;backdrop-filter:blur(20px);box-shadow:var(--sh);animation:up .5s}
.ac .logo{height:42px;margin:0 auto 18px}
.ac h2{font-family:Outfit,sans-serif;text-align:center;font-size:20px;margin-bottom:4px}
.ac .sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
.prf{position:relative;min-height:100%;padding:26px 16px 40px;text-align:center}
.prf .logo{height:40px;margin:0 auto 22px}
.prf h1{font-family:Outfit,sans-serif;font-size:clamp(22px,4vw,34px);margin-bottom:22px}
.pg{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:760px;margin:0 auto 26px}
.pi{width:128px;cursor:pointer;transition:.3s;animation:up .5s both}
.pi:hover{transform:translateY(-6px)}
.pi .pic{position:relative;width:110px;height:110px;margin:0 auto 10px;border-radius:50%;background-size:cover;background-position:center;border:3px solid var(--line);transition:.3s}
.pi:hover .pic{border-color:var(--a);box-shadow:0 0 0 4px var(--b1),0 12px 30px var(--glow)}
.pi b{font-size:14px;color:var(--mut);display:block}.pi:hover b{color:var(--tx)}
.pi .kid{position:absolute;bottom:-2px;right:-4px}
.pi .ed{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);display:none;place-items:center;color:#fff;font-size:26px}
.editing .pi .ed{display:grid}
.pi.add .pic{display:grid;place-items:center;background:var(--card);color:var(--mut);font-size:36px}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;max-height:220px;overflow-y:auto;padding:4px}
.avs div{aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;cursor:pointer;border:3px solid transparent;transition:.2s}
.avs div:hover{transform:scale(1.08)}.avs div.on{border-color:var(--a)}
.prev{width:84px;height:84px;border-radius:50%;background-size:cover;background-position:center;margin:0 auto 12px;border:3px solid var(--a);box-shadow:0 0 24px var(--glow)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;font-size:13px}
.tg input{width:42px;height:24px;appearance:none;background:var(--line);border-radius:24px;position:relative;cursor:pointer;transition:.3s;flex:none}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.3s}
.tg input:checked{background:linear-gradient(135deg,var(--a),var(--a2))}.tg input:checked::after{left:21px}
/* REQUESTS / ADMIN / PARTY */
.wrap{padding:0 max(16px,3vw);max-width:900px;margin:0 auto}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.rq{display:flex;gap:12px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;align-items:center}
.rq img{width:54px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--bg2);flex:none}
.rq .t{flex:1;min-width:0}.rq .t b{display:block;font-size:14px}.rq .t span{font-size:12px;color:var(--mut)}
.rq .ac2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stt{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.stt.pending{background:#f59e0b33;color:#fbbf24}.stt.accepted{background:#22c55e33;color:#4ade80}.stt.rejected{background:#ef444433;color:#f87171}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin-top:12px}
.res .card{width:100%}
.code{font-family:Outfit,sans-serif;font-size:34px;letter-spacing:8px;font-weight:800;text-align:center;padding:12px;border-radius:14px;background:var(--card);border:1px dashed var(--a);margin:10px 0}
.ppl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pp{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;animation:up .3s}
.pp .av{width:26px;height:26px;border-radius:50%;border:0}
.pp .crown{color:#fbbf24}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);z-index:500;padding:11px 18px;border-radius:999px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-weight:600;font-size:13px;box-shadow:0 10px 30px var(--glow);transition:.4s;max-width:90vw;display:flex;gap:8px;align-items:center}
.toast.on{transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 16px 36px}
@media(max-width:700px){.ep img{width:78px}.hc{bottom:80px}}
.maint{position:fixed;inset:0;z-index:140;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px;overflow-y:auto}
.maint.on{display:grid}
.maint::before{content:"";position:fixed;inset:0;background:radial-gradient(50% 40% at 50% 30%,var(--b1),transparent 70%);pointer-events:none}
.maint>div{position:relative;animation:up .6s}
.spin{position:relative;width:104px;height:104px;margin:0 auto 24px}
.spin::before{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--line);border-top-color:var(--a);border-right-color:var(--a2);animation:rot 1s linear infinite;box-shadow:0 0 30px var(--glow)}
.spin i,.spin svg{position:absolute;inset:0;margin:auto;width:40px!important;height:40px!important;color:var(--a2);animation:rot 5s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.maint h1{font-family:Outfit,sans-serif;font-size:26px;margin-bottom:8px}
.maint p{color:var(--mut);max-width:360px;margin:0 auto 20px;line-height:1.55}
.typ{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:12px}
.typ button{padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);transition:.2s}
.typ button.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent}
.oauth{display:grid;gap:8px;margin-top:12px}
.oauth button{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;transition:.2s}
.oauth button:hover{border-color:var(--a);transform:translateY(-1px)}
.oauth svg.o{width:18px;height:18px}
.dv{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0 0}.dv::before,.dv::after{content:"";flex:1;height:1px;background:var(--line)}
.chip.mt2{background:#f59e0b;color:#2b1800;border:0}
</style>
</head>

const keyOf = i => `${i.type}-${i.id}`;
const isAnime = x => (x.genre_ids || (x.genres || []).map(g => g.id) || []).includes(16) && x.original_language === 'ja';
function norm(x, forced) {
  const type = forced || x.media_type || (x.first_air_date !== undefined ? 'tv' : 'movie');
  return { id: x.id, type, anime: isAnime(x), poster: x.poster_path, back: x.backdrop_path, vote: x.vote_average || 0, date: x.release_date || x.first_air_date || '', ov: x.overview || '', title: x.title || x.name || '', pop: x.popularity || 0, adult: !!x.adult };
}
function merge(arr, items, front) {
  const ids = new Set(arr.map(keyOf));
  const fresh = items.filter(i => i.poster && !ids.has(keyOf(i)) && !i.adult && !S.hidden.has(keyOf(i)));
  ids.clear(); const uniq = []; fresh.forEach(i => { if (!uniq.some(u => keyOf(u) === keyOf(i))) uniq.push(i); });
  if (front) arr.unshift(...uniq); else arr.push(...uniq);
  return uniq;
}
const byKey = k => [...S.movie, ...S.tv, ...S.anime, ...S.kidsM, ...S.kidsT, ...S.news, ...S.soon, ...S.top, ...S.hero, ...S.extra, ...[...S.cat.values()].map(c => c.meta).filter(Boolean)].find(i => keyOf(i) === k);

/* ---- selos ---- */
function badgesOf(i) {
  const out = [], k = keyOf(i), now = Date.now(), d = i.date ? new Date(i.date + 'T00:00:00') : null;
  if (S.hot.has(k)) out.push(['alta', 'flame', t('hotB')]);
  const c = S.cat.get(k); if (c && now - new Date(c.first_seen).getTime() < CONFIG.NEW_DAYS * 864e5) out.push(['novo', 'sparkles', t('newB')]);
  if (d && d > now) out.push(['breve', 'clock', t('soonB')]);
  else if (d && now - d < CONFIG.LAUNCH_DAYS * 864e5) out.push(['lanc', 'rocket', t('launchB')]);
  return out.slice(0, 2);
}
const kindLabel = i => i.anime ? t('anime') : i.type === 'movie' ? t('film') : t('serie');
</script>

<script>
/* =====================================================================
   CAMADA DE DADOS — Supabase quando configurado, senão modo demo local
   ===================================================================== */
const genId = (n = 8) => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = crypto.getRandomValues(new Uint8Array(n)); return [...a].map(x => c[x % c.length]).join(''); };
const newKfId = () => 'KF-' + genId(8);
async function sha(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'x' + h; } }
const svgAv = (bg, fg, mouth) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="${bg}"/><circle cx="38" cy="48" r="7" fill="${fg}"/><circle cx="82" cy="48" r="7" fill="${fg}"/><path d="${mouth}" stroke="${fg}" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`);
const PRESETS = [svgAv('#8b00d0', '#1a0033', 'M42 76 q18 16 36 0'), svgAv('#0f8a85', '#fff', 'M36 78 q24 14 48 0'), svgAv('#e11d2e', '#fff', 'M40 80 q20 -12 40 0'), svgAv('#2563eb', '#fff', 'M40 76 h40'), svgAv('#f59e0b', '#2b1800', 'M38 74 q22 22 44 0'), svgAv('#ec4899', '#fff', 'M42 78 q18 10 36 0'), svgAv('#10b981', '#022c22', 'M38 76 q22 16 44 0'), svgAv('#475569', '#fff', 'M40 82 q20 -14 40 0')];
const defProfiles = email => [{ id: genId(6), name: (email || 'Perfil').split('@')[0].slice(0, 14), type: 'normal', kids: false, avatar: PRESETS[0] }, { id: genId(6), name: 'Kids', type: 'kids', kids: true, avatar: PRESETS[4] }];

const DB = {
  mode: 'local', sb: null,
  init() {

  },
  isAdmin(u) { return !!u && u.confirmed !== false && (u.email || '').toLowerCase() === CONFIG.ADMIN_EMAIL.toLowerCase(); },
  /* ---------- auth ---------- */
  async user() {

    const e = LS.get('kfl_session', null), us = LS.get('kfl_users', {}); return e && us[e] ? { id: us[e].uid, email: e, confirmed: true } : null;
  },
  async signUp(email, pass) {

  },
  async signInId(id) {

      const r = await fetch(CONFIG.SUPABASE_URL + '/functions/v1/id-login', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON, Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON }, body: JSON.stringify({ id }) });
      const j = await r.json().catch(() => ({})); if (!r.ok || !j.token_hash) throw new Error(j.error || 'ID inválido');
      const { error } = await this.sb.auth.verifyOtp({ token_hash: j.token_hash, type: 'magiclink' }); if (error) throw error; return;
    }
    const us = LS.get('kfl_users', {}), e = Object.keys(us).find(k => us[k].kf_id === id && k.toLowerCase() !== CONFIG.ADMIN_EMAIL.toLowerCase());
    if (!e) throw new Error('ID inválido'); LS.set('kfl_session', e);
  },
  async signOut() { if (this.sb) await this.sb.auth.signOut(); else LS.del('kfl_session'); },
  async resetPassword(email) {
    if (this.sb) { const { error } = await this.sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.href.split('#')[0] }); if (error) throw error; return true; }
    return false;
  },
  async setPassword(pw, email) {

    const us = LS.get('kfl_users', {}); email = (email || '').trim().toLowerCase(); if (!us[email]) throw new Error('E-mail não encontrado'); us[email].pass = await sha(pw); LS.set('kfl_users', us);
  },
  onRecovery(cb) { if (this.sb) this.sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') cb(); }); },
  /* ---------- conta / perfis ---------- */
  async acct(u) {
    if (this.sb) {
      let { data } = await this.sb.from('accounts').select('kf_id,profiles').eq('user_id', u.id).maybeSingle();

    const us = LS.get('kfl_users', {}); us[u.email].profiles = profiles; LS.set('kfl_users', us);
  },
  /* ---------- pedidos ---------- */
  async reqMine(u) {
    if (this.sb) { const { data } = await this.sb.from('requests').select('*').eq('user_id', u.id).order('created_at', { ascending: false }); return data || []; }
    return LS.get('kfl_req', []).filter(r => r.user_id === u.id).reverse();
  },
  async reqAll() {
    if (this.sb) { const { data } = await this.sb.from('requests').select('*').order('created_at', { ascending: false }); return data || []; }
    return LS.get('kfl_req', []).slice().reverse();
  },
  async reqCreate(u, r) {
    r.requester = u.email;
    if (this.sb) { const { error } = await this.sb.from('requests').insert({ ...r, status: 'pending' }); if (error) throw error; return; }
    const a = LS.get('kfl_req', []); a.push({ ...r, id: genId(10), user_id: u.id, status: 'pending', created_at: new Date().toISOString() }); LS.set('kfl_req', a);
  },
  async reqReview(id, status) {
    if (this.sb) { const { error } = await this.sb.from('requests').update({ status, reviewed_at: new Date().toISOString() }).eq('id', id); if (error) throw error; return; }
    const a = LS.get('kfl_req', []), r = a.find(x => x.id === id); if (r) r.status = status; LS.set('kfl_req', a);
  },
  /* ---------- OAuth (Google / Discord) ---------- */
  async oauth(provider) {
    if (!this.sb) throw new Error('Supabase');
    const { error } = await this.sb.auth.signInWithOAuth({ provider, options: { redirectTo: location.href.split('#')[0] } }); if (error) throw error;
  },
  /* ---------- configurações (manutenção, títulos excluídos) ---------- */
  async setting(key) {
    if (this.sb) { const { data } = await this.sb.from('settings').select('value').eq('key', key).maybeSingle(); return data ? data.value : null; }
    return LS.get('kfl_set_' + key, null);
  },
  async setSetting(key, value) {

    LS.set('kfl_set_' + key, value);
  },
  async reqDel(id) {
    if (this.sb) { const { error } = await this.sb.from('requests').delete().eq('id', id); if (error) throw error; return; }
    LS.set('kfl_req', LS.get('kfl_req', []).filter(r => r.id !== id));
  },
  async catDel(key) {
    if (this.sb) { await this.sb.from('catalog').delete().eq('key', key); return; }
    const m = LS.get('kfl_cat', {}); delete m[key]; LS.set('kfl_cat', m);
  },
  /* ---------- fontes extras (só admin escreve) ---------- */
  async srcLoad() {
    if (this.sb) { const { data } = await this.sb.from('sources').select('key,urls'); return Object.fromEntries((data || []).map(r => [r.key, r.urls])); }
    return LS.get('kfl_src', {});
  },
  async srcSet(key, urls) {
    if (this.sb) { const { error } = urls.length ? await this.sb.from('sources').upsert({ key, urls, updated_at: new Date().toISOString() }) : await this.sb.from('sources').delete().eq('key', key); if (error) throw error; return; }
    const m = LS.get('kfl_src', {}); if (urls.length) m[key] = urls; else delete m[key]; LS.set('kfl_src', m);
  },
  /* ---------- catálogo (selo NOVO) ---------- */
  async catLoad() {
    if (this.sb) { const { data } = await this.sb.from('catalog').select('key,first_seen,custom,meta'); return data || []; }
    return Object.entries(LS.get('kfl_cat', {})).map(([key, v]) => ({ key, ...v }));
  },
  async catAdd(rows) {
    if (!rows.length) return;
    if (this.sb) { await this.sb.from('catalog').upsert(rows, { onConflict: 'key', ignoreDuplicates: true }); return; }
    const m = LS.get('kfl_cat', {}); rows.forEach(r => { if (!m[r.key]) m[r.key] = { first_seen: r.first_seen, custom: !!r.custom, meta: r.meta }; }); LS.set('kfl_cat', m);

    const c = {}; LS.get('kfl_views', []).forEach(v => { (c[v.key] = c[v.key] || new Set()).add(v.u); }); return new Set(Object.keys(c).filter(k => c[k].size > CONFIG.HOT_MIN));

  channel(name, onmsg) {

<script>
/* =====================================================================
   INTERFACE: header, home, carrossel do hero, linhas, cards, páginas
   ===================================================================== */
const hcache = {};
async function details(type, id) {
  const k = type + id; if (hcache[k]) return hcache[k];
  return hcache[k] = await api(`/${type}/${id}`, { append_to_response: 'videos,credits,similar,images,release_dates,content_ratings', include_image_language: `${S.L},en,null`, include_video_language: `${S.L},en,null` });
}
const trailerOf = d => { const v = (d.videos?.results || []).filter(v => v.site === 'YouTube'); return (v.find(x => x.type === 'Trailer' && x.iso_639_1 === S.L) || v.find(x => x.type === 'Trailer') || v.find(x => x.type === 'Teaser') || v[0])?.key; };
const logoOf = d => { const l = d.images?.logos || []; return (l.find(x => x.iso_639_1 === S.L) || l.find(x => x.iso_639_1 === 'en') || l[0])?.file_path; };
function ageOf(d) {
  let c;
  if (d.release_dates) { const br = d.release_dates.results.find(r => r.iso_3166_1 === 'BR') || d.release_dates.results.find(r => r.iso_3166_1 === 'US'); c = br?.release_dates.find(x => x.certification)?.certification; }
  if (d.content_ratings) { const br = d.content_ratings.results.find(r => r.iso_3166_1 === 'BR') || d.content_ratings.results.find(r => r.iso_3166_1 === 'US'); c = br?.rating; }
  const m = { L: 'L', '10': '10', '12': '12', '14': '14', '16': '16', '18': '18', G: 'L', PG: '10', 'PG-13': '12', R: '16', 'NC-17': '18', 'TV-Y': 'L', 'TV-Y7': 'L', 'TV-G': 'L', 'TV-PG': '10', 'TV-14': '14', 'TV-MA': '18' };
  return m[c] || (d.adult ? '18' : (d.genres || []).some(g => g.id === 10751 || g.id === 10762) ? 'L' : '14');
}
const kidsOK = d => ['L', '10'].includes(ageOf(d));
const runtime = d => d.runtime || (d.episode_run_time && d.episode_run_time[0]) || d.last_episode_to_air?.runtime || 0;

/* ---- carregamento ---- */
const KIDS_M = { with_genres: '16|10751', without_genres: '27,53,80,10749,10752,18,9648', sort_by: 'popularity.desc', include_adult: false };
const KIDS_T = { with_genres: '16|10762|10751', without_genres: '80,9648,10768,18', sort_by: 'popularity.desc', include_adult: false };
const ANI = { with_genres: 16, with_original_language: 'ja', sort_by: 'popularity.desc' };
async function loadAll() {
  const today = new Date().toISOString().slice(0, 10);
  try { S.hidden = new Set(((await DB.setting('hidden')) || {}).keys || []); } catch {}
  const [tr, mv, tv, an, an2, np, up, otr, k1, k2] = await Promise.all([
    api('/trending/all/day'), api('/movie/popular'), api('/tv/popular'), api('/discover/tv', ANI), api('/discover/movie', ANI),
    api('/movie/now_playing'), api('/discover/movie', { 'primary_release_date.gte': today, sort_by: 'popularity.desc', include_adult: false }),
    api('/tv/on_the_air'), altFetch('M'), altFetch('T')
  ]);
  const t0 = tr.results.filter(x => x.media_type !== 'person').map(x => norm(x));
  S.top = t0.filter(x => x.poster && !x.adult).slice(0, 10);
  S.hero = t0.filter(x => x.back && !x.adult).slice(0, 7);
  S.movie = []; merge(S.movie, [...np.results, ...mv.results].map(x => norm(x, 'movie')));
  S.tv = []; merge(S.tv, [...otr.results, ...tv.results].map(x => norm(x, 'tv')));
  S.anime = []; merge(S.anime, [...an.results.map(x => norm(x, 'tv')), ...an2.results.map(x => norm(x, 'movie'))].sort((a, b) => b.pop - a.pop));
  S.soon = []; merge(S.soon, up.results.map(x => norm(x, 'movie')).filter(i => i.date > today));
  S.kidsM = []; merge(S.kidsM, k1.results.map(x => norm(x, 'movie')));
  S.kidsT = []; merge(S.kidsT, k2.results.map(x => norm(x, 'tv')));
  S.news = [];
  const all = [...S.movie, ...S.tv, ...S.anime, ...S.soon];
  const rows = await DB.catLoad();
  const first = rows.length === 0;
  rows.forEach(r => S.cat.set(r.key, r));
  const stamp = new Date(first ? 0 : Date.now()).toISOString();
  const fresh = all.filter(i => !S.cat.has(keyOf(i))).map(i => ({ key: keyOf(i), first_seen: stamp, custom: false, meta: i }));
  fresh.forEach(r => S.cat.set(r.key, r)); await DB.catAdd(fresh);
  all.forEach(i => S.seen.add(keyOf(i)));
  [...S.cat.values()].filter(c => c.custom && c.meta && !S.hidden.has(c.key)).forEach(c => { const i = c.meta; (i.anime ? S.anime : i.type === 'tv' ? S.tv : S.movie).unshift(i); });
  buildNews();
  try { S.hot = await DB.hotLoad(); } catch {}
}
function buildNews() {
  const cut = Date.now() - CONFIG.NEW_DAYS * 864e5;
  S.news = [...S.cat.values()].filter(c => new Date(c.first_seen).getTime() > cut && c.meta && c.meta.poster && !S.hidden.has(c.key)).sort((a, b) => new Date(b.first_seen) - new Date(a.first_seen)).map(c => c.meta);
}
/* a cada 1 minuto: busca páginas novas de filmes, séries e animes */
async function refresh() {
  if (!KEY || !S.user) return;
  S.cycle++; const p = ((S.cycle - 1) % 20) + 1, today = new Date().toISOString().slice(0, 10);
  try {
    const [a, b, c, d, e] = await Promise.all([
      api('/trending/all/day', { page: p }), api('/movie/now_playing', { page: p }), api('/tv/on_the_air', { page: p }),
      api('/discover/tv', { ...ANI, sort_by: 'first_air_date.desc', 'first_air_date.lte': today, 'vote_count.gte': 1, page: Math.min(p, 5) }),
      api('/discover/movie', { 'primary_release_date.gte': today, sort_by: 'primary_release_date.asc', include_adult: false, page: Math.min(p, 5) })
    ]);
    const nm = merge(S.movie, [...b.results.map(x => norm(x, 'movie')), ...a.results.filter(x => x.media_type === 'movie').map(x => norm(x))], true);
    const ns = merge(S.tv, [...c.results.map(x => norm(x, 'tv')), ...a.results.filter(x => x.media_type === 'tv').map(x => norm(x))], true);
    const na = merge(S.anime, d.results.map(x => norm(x, 'tv')), true);
    const nu = merge(S.soon, e.results.map(x => norm(x, 'movie')).filter(i => i.date > today));
    const nw = [...nm, ...ns, ...na, ...nu].filter(i => !S.cat.has(keyOf(i)));
    const rows = nw.map(i => ({ key: keyOf(i), first_seen: new Date().toISOString(), custom: false, meta: i }));
    rows.forEach(r => S.cat.set(r.key, r)); await DB.catAdd(rows);
    if (S.cycle % 3 === 0) { try { S.hot = await DB.hotLoad(); } catch {} }
    buildNews();
    if (rows.length) { if (S.tab === 'home') renderRows(true); else if (S.tab === 'news') go('news'); toast(`${rows.length} ${t('news').toLowerCase()}`, 'flame'); }
  } catch (e) { console.warn('refresh', e); }
}

/* ---- cards ---- */
function card(i, o = {}) {
  const bs = o.nobadge ? [] : badgesOf(i);
  const bd = bs.length ? `<div class="bd">${bs.map(b => `<span class="b ${b[0]}">${ic(b[1])}${esc(b[2])}</span>`).join('')}</div>` : (o.nobadge ? '' : `<div class="bd"><span class="b kind">${esc(kindLabel(i))}</span></div>`);
  const rt = o.rate && i.vote ? `<div class="rt">${ic('star')}${i.vote.toFixed(1)}</div>` : '';
  const prog = o.prog != null ? `<div class="prog"><i style="width:${o.prog}%"></i></div>` : '';
  const x = o.rm ? `<button class="x" data-rm="${keyOf(i)}" aria-label="remove">${ic('x')}</button>` : '';
  return `<div class="card" data-k="${keyOf(i)}">${bd}${rt}${x}<div class="pl">${ic('play')}</div><img loading="lazy" src="${IMG}w342${i.poster}" alt="" onload="this.classList.add('ld')">${prog}</div>`;
}
function rowHTML(title, items, o = {}) {
  if (!items.length) return '';
  let inner;
  if (o.top) inner = items.map((i, n) => `<div class="item"><span class="num">${n + 1}</span>${card(i)}</div>`).join('');

const isFile = u => /\.(mp4|webm|m3u8|mov)(\?|$)/i.test(u);
function sourcesFor(o) {

  const it = byKey(keyOf(o)) || { type: o.type, id: +o.id, poster: S.detail?.d?.poster_path, back: S.detail?.d?.backdrop_path, vote: S.detail?.d?.vote_average || 0, date: S.detail?.d?.release_date || S.detail?.d?.first_air_date || '', title: o.title };

    ${o.type === 'tv' && !guest ? `<div class="pnav"><button class="btn g sm" onclick="plEp(-1)">${ic('skip-back')}${t('prev')}</button><button class="btn p sm" onclick="plEp(1)">${t('next')}${ic('skip-forward')}</button></div>` : ''}`;
  const v = $('#pv'); if (v && party) { if (party.host) ['play', 'pause', 'seeked'].forEach(ev => v.addEventListener(ev, () => party.send({ t: 'ctl', a: ev, time: v.currentTime }))); else v.controls = false; }
}
function plSrc(n) { PL.idx = n; drawPlayer(); if (PL.party?.host) PL.party.send({ t: 'src', idx: n }); }
async function plEp(dir) {
  const { o } = PL, id = o.id; let s = o.s, e = o.e + dir, d = hcache['tv' + id] || S.detail?.d;
  const sd = seasonCache[id + '-' + s] || (seasonCache[id + '-' + s] = await api(`/tv/${id}/season/${s}`));
  if (e > sd.episodes.length) { s++; e = 1; if (!(d.seasons || []).some(x => x.season_number === s)) return toast('FIM', 'check'); }
  if (e < 1) { if (s <= 1) return; s--; const pd = seasonCache[id + '-' + s] || (seasonCache[id + '-' + s] = await api(`/tv/${id}/season/${s}`)); e = pd.episodes.length; }
  saveWatch(); const party = PL.party; closePlayer(true); openPlayer({ ...o, s, e }, party); if (party?.host) party.send({ t: 'ep', o: { ...o, s, e } });
}
function saveWatch() {
  if (!PL || PL.party) return; const w = PL, o = w.o, watched = Math.min(w.total - 1, w.base + (Date.now() - w.t0) / 60000);
  let c = getCont().filter(x => !(x.type === o.type && x.id == o.id)); c.unshift({ type: o.type, id: +o.id, s: o.s, e: o.e, watched, pct: Math.max(3, Math.round(watched / w.total * 100)), left: Math.max(1, Math.round(w.total - watched)), snap: { ...w.snap } });

  $('#player').classList.remove('on'); $('#player').innerHTML = ''; document.body.style.overflow = $('#ov').classList.contains('on') ? 'hidden' : '';

/* ---- fontes extras (só Admin) ---- */
function srcModal(key, label) {

  const urls = [...(S.srcs[key] || [])];
  const draw = () => openModal(`<h3>${ic('link-2')}${t('manageSrc')}</h3><p class="sub">${esc(label)}</p>

addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#md').classList.contains('on')) closeModal(); else if (PL) closePlayer(); else if ($('#sr').classList.contains('on')) closeSearch(); else if ($('#ov').classList.contains('on')) closeDetail(); } });

<script>
/* =====================================================================
   WATCH PARTY — só o anfitrião inicia/controla; convidados esperam no lobby
   ===================================================================== */
let P = null;
function partyModal(o) {
  openModal(`<h3>${ic('users')}${t('party')}</h3><p class="sub">${esc(o.title || '')}</p>
  <div class="tabs2"><button class="on" id="pt1" onclick="ptab(1)">${ic('plus-circle')}${t('create')}</button><button id="pt2" onclick="ptab(2)">${ic('log-in')}${t('join')}</button></div>
  <div id="pbody"></div>`);
  window.ptab = n => {
    $('#pt1').classList.toggle('on', n === 1); $('#pt2').classList.toggle('on', n === 2);
    $('#pbody').innerHTML = n === 1
      ? `<div class="f"><label>${t('roomName')}</label><input class="inp" id="rn" maxlength="30" value="${esc((S.prof?.name || '') + ' · Party')}"></div><button class="btn p" style="width:100%" onclick='startRoom(${esc(JSON.stringify(o))})'>${ic('door-open')}${t('create')}</button>`
      : `<div class="f"><label>${t('code')}</label><input class="inp" id="rc" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:20px"></div><button class="btn p" style="width:100%" onclick="joinRoom()">${ic('log-in')}${t('join')}</button>`;
    $$('#pbody .btn').forEach(b => b.removeAttribute('onclick')); const b = $('#pbody .btn');
    b.onclick = n === 1 ? () => startRoom(o) : () => joinRoom();
  };
  ptab(1);
}
function me() { return { id: S.user.id + ':' + S.prof.id, name: S.prof.name, avatar: S.prof.avatar }; }
function partyOpen(code, host, o, name) {
  partyLeave(true);
  P = { code, host, o, name, started: false, people: new Map(), found: host };
  P.ch = DB.channel('party-' + code, onPartyMsg);
  P.api = { host, name, send: m => P.ch.send(m) };
  const beat = () => { const m = { t: 'hi', ...me(), host }; if (host) m.room = { name: P.name, o: P.o, started: P.started }; P.ch.send(m); const now = Date.now(); P.people.forEach((v, k) => { if (now - v.seen > 9000) P.people.delete(k); }); if (!PL) drawLobby(); };
  setTimeout(beat, 600); P.timer = setInterval(beat, 3000);
  if (!host) P.wait = setTimeout(() => { if (P && !P.found) { toast('Sala não encontrada', 'search-x'); partyLeave(); } }, 6500);
  drawLobby();
}
function startRoom(o) { const name = ($('#rn')?.value || 'Party').trim().slice(0, 30) || 'Party'; partyOpen(genId(6), true, o, name); }
function joinRoom() { const c = ($('#rc')?.value || '').trim().toUpperCase(); if (c.length < 4) return; partyOpen(c, false, null, ''); }
function onPartyMsg(m) {
  if (!P || !m) return;
  if (m.t === 'hi') {
    const isNew = !P.people.has(m.id); P.people.set(m.id, { name: m.name, avatar: m.avatar, host: m.host, seen: Date.now() }); if (isNew && !PL) setTimeout(drawLobby, 0);
    if (m.host && !P.host) { P.found = true; P.name = m.room.name; P.o = m.room.o; if (m.room.started && !P.started && !PL) partyGo(); }
  } else if (m.t === 'start' && !P.host) partyGo();
  else if (m.t === 'ctl' && !P.host) {
    const v = $('#pv'); if (!v) return;
    if (Math.abs(v.currentTime - m.time) > 1.5) v.currentTime = m.time;
    if (m.a === 'play') v.play().catch(() => {}); else if (m.a === 'pause') v.pause();
  } else if (m.t === 'src' && !P.host && PL) { PL.idx = m.idx; drawPlayer(); }
  else if (m.t === 'ep' && !P.host) { closePlayer(true); openPlayer(m.o, P.api); }
  else if (m.t === 'bye' && m.host && !P.host) { toast(t('leave'), 'door-closed'); partyLeave(); }
}
function partyGo() { P.started = true; closeModal(); openPlayer(P.o, P.api); }
function partyStart() { if (!P?.host) return; P.started = true; P.ch.send({ t: 'start' }); partyGo(); }
function drawLobby() {
  if (!P) return; const mb = $('#mb'); if (!$('#md').classList.contains('on')) $('#md').classList.add('on');
  const mm = me(), all = [[mm.id, { name: mm.name, avatar: mm.avatar, host: P.host }], ...[...P.people.entries()].filter(([id]) => id !== mm.id)];
  const ppl = all.map(([id, v]) => `<div class="pp"><div class="av" style="background-image:url('${esc(v.avatar)}')"></div>${esc(v.name)}${v.host ? ` <span class="crown">${ic('crown')}</span>` : ''}</div>`).join('');
  const html = `<h3>${ic('popcorn')}${esc(P.name || '...')}</h3><p class="sub">${esc(P.o?.title || '')}${P.o?.type === 'tv' ? ` · S${P.o.s}E${P.o.e}` : ''}</p>
    <div class="code">${esc(P.code)}</div><div style="text-align:center"><button class="btn s sm" onclick="copyTxt('${esc(P.code)}')">${ic('copy')}${t('copy')}</button></div>
    <div class="ppl">${ppl || '<span class="sub">…</span>'}</div>
    ${P.host ? `<button class="btn p" style="width:100%;margin-bottom:8px" onclick="partyStart()">${ic('play')}${t('start')}</button>` : `<div class="note">${ic('loader')}<span>${t('waiting')}</span></div>`}
    <button class="btn s" style="width:100%" onclick="partyLeave()">${ic('log-out')}${t('leave')}</button>`;
  if (mb.dataset.lobby !== '1' || mb.innerHTML !== html) { mb.className = 'mb'; mb.innerHTML = html; mb.dataset.lobby = '1'; }
}
function partyLeave(quiet) {
  if (!P) return; const p = P; P = null; clearInterval(p.timer); clearTimeout(p.wait);
  try { p.ch.send({ t: 'bye', host: p.host }); } catch {} setTimeout(() => p.ch.close(), 300);
  $('#mb').dataset.lobby = ''; if (!quiet) { closeModal(); if (PL) closePlayer(true); }
}
</script>

<script>
/* =====================================================================
   LOGIN / REGISTRO / ID / SENHA / PERFIS
   ===================================================================== */
function pwLevel(p) {
  if (!p) return 0; let s = 0; if (p.length >= 8) s++; if (p.length >= 12) s++; if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++;
  if (/^(123456|12345678|password|senha|qwerty|abc123|iloveyou)/i.test(p)) s = 0;
  return s <= 1 ? 1 : s === 2 ? 2 : s <= 4 ? 3 : 4;
}
const PWC = ['', '#ef4444', '#f59e0b', '#84cc16', '#22c55e'];

}

function pwMeter(v) { const l = pwLevel(v); $$('.meter i').forEach((e, n) => e.style.background = n < l ? PWC[l] : ''); const m = $('#mlab'); if (m) { m.textContent = l ? [, t('weak'), t('ok'), t('good'), t('strong')][l] : ''; m.style.color = PWC[l]; } }
const GSVG = '<b style="font-family:Outfit,sans-serif;font-size:19px;background:conic-gradient(#ea4335,#fbbc05,#34a853,#4285f4,#ea4335);-webkit-background-clip:text;background-clip:text;color:transparent">G</b>';
const DSVG = '<i data-lucide="gamepad-2" style="color:#5865F2"></i>';
const oauthHTML = () => `<div class="dv">${t('or')}</div><div class="oauth"><button type="button" onclick="oauthGo('google')">${GSVG}${t('google')}</button><button type="button" onclick="oauthGo('discord')">${DSVG}${t('discord')}</button></div>`;
async function oauthGo(p) { try { await DB.oauth(p); } catch (e) { authErr(e.message || String(e)); } }
function authErr(m) { const e = $('#aerr'); if (e) { e.innerHTML = ic('alert-circle') + esc(m); e.style.display = 'flex'; } }
function showAuth(mode = 'login') {
  $('#scrProf').classList.remove('on'); $('#hd').style.display = 'none'; $('#home').style.display = 'none'; $('#view').style.display = 'none';
  const sc = $('#scrAuth'); sc.classList.add('on');
  const tabs = ['login', 'register', 'id'].includes(mode) ? `<div class="tabs2"><button class="${mode === 'login' ? 'on' : ''}" onclick="showAuth('login')">${ic('log-in')}${t('login')}</button><button class="${mode === 'register' ? 'on' : ''}" onclick="showAuth('register')">${ic('user-plus')}${t('register')}</button><button class="${mode === 'id' ? 'on' : ''}" onclick="showAuth('id')">${ic('fingerprint')}ID</button></div>` : '';
  let body = '', title = t('welcome'), act = '';
  if (mode === 'login') body = `<div class="f"><label>${t('email')}</label><input class="inp" id="em" type="email" autocomplete="email"></div>${pwField('pw', t('pass'))}<div style="text-align:right;margin:-4px 0 12px"><span class="lnk" onclick="showAuth('forgot')">${t('forgot')}</span></div>`, act = `<button class="btn p" style="width:100%" id="go">${ic('log-in')}${t('login')}</button>`;
  if (mode === 'register') title = t('createAcc'), body = `<div class="f"><label>${t('email')}</label><input class="inp" id="em" type="email" autocomplete="email"></div>${pwField('pw', t('pass'), true)}${pwField('pw2', t('pass2'))}`, act = `<button class="btn p" style="width:100%" id="go">${ic('user-plus')}${t('register')}</button>`;
  if (mode === 'id') title = t('byId'), body = `<div class="f"><label>ID</label><input class="inp" id="kid" placeholder="${esc(t('idph'))}" maxlength="11" style="text-transform:uppercase;letter-spacing:2px;text-align:center"></div>`, act = `<button class="btn p" style="width:100%" id="go">${ic('fingerprint')}${t('login')}</button>`;

      $('#ainfo').innerHTML = `<div class="box"><div class="rq" style="margin:0 0 12px"><img src="${IMG}w185${full.poster_path}" alt=""><div class="t"><b>${esc(title)}</b><span>${esc((full.release_date || full.first_air_date || '').slice(0, 4))} · TMDB ${full.id}</span></div></div>
        ${mtype === 'movie' ? `<button class="btn p" style="width:100%" id="amg">${ic('link-2')}${t('manageSrc')}</button>` : `<div id="pn"></div>`}</div>`;
      if (mtype === 'movie') $('#amg').onclick = () => srcModal(srcKey('movie', full.id), title); else renderEps($('#pn'));
    } catch { $('#ainfo').innerHTML = `<div class="empty">${ic('search-x')}${t('nomore')}</div>`; }
  };
  $('#abt').onclick = run; $('#aid').onkeydown = e => { if (e.key === 'Enter') run(); };
}

/* ---------- admin: catálogo (excluir títulos) ---------- */
function removeFromPools(key) {
  [S.movie, S.tv, S.anime, S.kidsM, S.kidsT, S.news, S.soon, S.top, S.hero].forEach(a => { for (let i = a.length - 1; i >= 0; i--) if (keyOf(a[i]) === key) a.splice(i, 1); });
  S.cat.delete(key);
}
async function saveHidden() { await DB.setSetting('hidden', { keys: [...S.hidden] }); }
function adminCat() {
  const el = $('#abody2');
  el.innerHTML = `<div class="box"><div class="row2"><input class="inp" id="cq" placeholder="${esc(t('name'))} / ID"><button class="btn p" id="cb" style="flex:none">${ic('search')}${t('find')}</button></div><div id="cres"></div></div><h3 style="font-family:Outfit;margin:14px 0 10px">${t('hiddenL')}</h3><div id="chid"></div>`;
  const row = (i, hid) => `<div class="rq"><img src="${i.poster ? IMG + 'w185' + i.poster : ''}" alt=""><div class="t"><b>${esc(i.title || keyOf(i))}</b><span>${esc((i.date || '').slice(0, 4))} · ${esc(kindLabel(i))} · ${keyOf(i)}</span></div>${hid ? `<button class="btn s sm" data-r="${keyOf(i)}">${ic('undo-2')}${t('restore')}</button>` : `<button class="btn d sm" data-h="${keyOf(i)}">${ic('trash-2')}${t('hide')}</button>`}</div>`;
  const hidList = () => { $('#chid').innerHTML = S.hidden.size ? [...S.hidden].map(k => row(S.hiddenMeta?.[k] || byKey(k) || { id: k.split('-')[1], type: k.split('-')[0], title: k, anime: false }, true)).join('') : `<div class="empty">${ic('film')}${t('nomore')}</div>`; };
  hidList(); let found = [];
  const run = async () => {
    const q = $('#cq').value.trim(); if (!q) return; $('#cres').innerHTML = `<div class="sk" style="height:70px;border-radius:14px;margin-top:12px"></div>`;
    try {
      if (/^\d+$/.test(q)) { for (const ty of ['movie', 'tv']) { try { found.push(norm(await api(`/${ty}/${q}`), ty)); } catch {} } found = found.filter(Boolean); }
      else found = (await api('/search/multi', { query: q, include_adult: false })).results.filter(x => x.media_type !== 'person').map(x => norm(x));
      found = found.slice(0, 12); $('#cres').innerHTML = `<div style="margin-top:12px">${found.map(i => row(i, S.hidden.has(keyOf(i)))).join('') || `<div class="empty">${ic('search-x')}${t('nomore')}</div>`}</div>`;
    } catch { $('#cres').innerHTML = ''; }
  };
  $('#cb').onclick = () => { found = []; run(); }; $('#cq').onkeydown = e => { if (e.key === 'Enter') { found = []; run(); } };
  el.onclick = async e => {
    const h = e.target.closest('[data-h]'), r = e.target.closest('[data-r]');
    try {
      if (h) {
        const k = h.dataset.h; if (!confirm(t('delAsk'))) return; const m = found.find(i => keyOf(i) === k) || byKey(k); (S.hiddenMeta = S.hiddenMeta || {})[k] = m;
        S.hidden.add(k); await saveHidden(); await DB.catDel(k); removeFromPools(k); buildNews(); heroBuild(); renderRows(true); toast(t('hide') + ' ✓', 'trash-2'); hidList(); h.closest('.rq').querySelector('button').outerHTML = `<button class="btn s sm" data-r="${k}">${ic('undo-2')}${t('restore')}</button>`;
      } else if (r) { const k = r.dataset.r; S.hidden.delete(k); await saveHidden(); toast(t('restore') + ' ✓', 'undo-2'); hidList(); if (found.length) run(); }
    } catch (er) { toast(er.message || 'Erro', 'alert-triangle'); }
  };
}
/* ---------- admin: manutenção ---------- */
function adminMaint() {
  const el = $('#abody2'), m = S.maint;
  el.innerHTML = `<div class="box"><div class="tg"><span>${ic('construction')} <b>${t('maintOn')}</b><br><small style="color:var(--mut)">${t('maintH')}</small></span><input type="checkbox" id="mon" ${m.on ? 'checked' : ''}></div>
    <div class="f"><label>${t('maintMsg')}</label><textarea class="inp" id="mmsg" rows="3" maxlength="200" placeholder="${esc(t('maintM'))}">${esc(m.msg)}</textarea></div>
    <button class="btn p" id="msv" style="width:100%">${ic('save')}${t('save')}</button></div>`;
  $('#msv').onclick = async () => {
    const v = { on: $('#mon').checked, msg: $('#mmsg').value.trim().slice(0, 200) };
    try { await DB.setSetting('maint', v); S.maint = v; buildNav(); applyMaint(); toast(v.on ? t('maintAct') : t('maint') + ' OFF', 'construction'); } catch (e) { toast(e.message || 'Erro', 'alert-triangle'); }
  };
}
async function checkMaint() { try { const v = await DB.setting('maint'); S.maint = { on: !!(v && v.on), msg: (v && v.msg) || '' }; } catch {} }
function applyMaint() {
  const el = $('#scrMaint'), block = S.maint.on && !S.admin;
  if (!block) { el.classList.remove('on'); el.innerHTML = ''; return; }
  closePlayer(true); partyLeave(true); closeModal(); $('#ov').classList.remove('on'); $('#sr').classList.remove('on'); $('#pop').classList.remove('on'); document.body.style.overflow = '';
  el.innerHTML = `<div><div class="spin">${ic('settings')}</div><h1>${esc(t('maintT'))}</h1><p>${esc(S.maint.msg || t('maintM'))}</p>${S.user ? `<button class="btn s sm" onclick="logout()">${ic('log-out')}${t('logout')}</button>` : `<button class="btn s sm" onclick="showAuth('login')">${ic('shield')}${t('staff')}</button>`}</div>`;
  el.classList.add('on');
}
async function pollMaint() {
  const was = S.maint.on; await checkMaint(); if (was === S.maint.on) return;
  applyMaint(); if (S.user) buildNav(); if (was && !S.maint.on && !S.user) showAuth();
}
function showSetup() {
  $('#scrAuth').classList.add('on'); $('#scrAuth').innerHTML = `<div class="auth"><div class="ac"><img class="logo" src="${LOGO}" alt="KiraFlix"><h2>${t('setupT')}</h2><p class="sub">SUPABASE_URL · SUPABASE_ANON</p><div class="note warn">${ic('settings')}<span>CONFIG → <b>SUPABASE_URL</b>, <b>SUPABASE_ANON</b>, <b>TMDB_KEY</b>. Rode o <b>kiraflix-setup.sql</b> no SQL Editor do Supabase.</span></div></div></div>`;
}

/* ---------- inicialização ---------- */
async function startApp(p) {
  S.prof = p; $('#scrProf').classList.remove('on'); $('#scrProf').innerHTML = '';
  $('#hd').style.display = ''; S.tab = 'home'; buildNav();
  const nk = $('#md'); if (!KEY) return askTmdb();
  await boot(); const m = location.hash.match(/^#\/(movie|tv)\/(\d+)/); if (m) openDetail(m[1] + '-' + m[2], false);
}
function askTmdb() {
  openModal(`<h3>${ic('key-round')}TMDB</h3><p class="sub">API Key (v3) / Token (v4)</p><div class="f"><input class="inp" id="tk" placeholder="TMDB key"></div><button class="btn p" style="width:100%" id="tkb">${t('login')}</button>`);
  $('#tkb').onclick = () => { const v = $('#tk').value.trim(); if (!v) return; KEY = v; LS.set('kf_tmdb', v); closeModal(); boot(); };
}
async function boot(reload) {
  if (!KEY || !S.user || !S.prof) return;
  $('#home').style.display = S.tab === 'home' ? '' : 'none';
  if (S.tab === 'home' && !reload) $('#hero').innerHTML = '<div class="sl on"><div class="bg sk"></div></div>';
  try { await loadAll(); S.srcs = await DB.srcLoad().catch(() => ({})); } catch (e) { console.error(e); toast('TMDB: ' + (e.message || 'erro'), 'alert-triangle'); return; }
  buildNav(); renderRows(); heroBuild();
  if (S.tab !== 'home') go(S.tab);
  if (!S.timer) S.timer = setInterval(refresh, CONFIG.REFRESH_MS);
}
(async function init() {
  document.documentElement.lang = TL[S.L];
  if (!DB.sb) return showSetup();
  await checkMaint(); setInterval(pollMaint, 30000);
  if (/type=recovery/.test(location.hash)) { S.recovering = true; showAuth('recovery'); return; }
  const u = await DB.user(); if (u) await afterAuth(); else if (S.maint.on) applyMaint(); else showAuth();
})();
</script>
</body>
