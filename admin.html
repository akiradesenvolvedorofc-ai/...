<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Admin — KiraFlix</title>
<style>
:root{
  --bg:#0a0a0f;--side:#0d0f16;--card:#13141b;--card2:#171923;--line:#1f212b;--line2:#2a2d3a;
  --tx:#fff;--mut:#8b8fa3;--mut2:#5f6378;
  --red:#dc2626;--red2:#ef4444;--blue:#2563eb;--green:#059669;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--info:#60a5fa;--vio:#a855f7;
  --inp:#101827;--inpb:#1e2a44;--r:18px;--side-w:262px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.4;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
code{font-family:ui-monospace,Menlo,monospace;background:rgba(220,38,38,.12);color:#f87171;padding:2px 7px;border-radius:6px;font-size:.82em;word-break:break-all}
::selection{background:rgba(220,38,38,.5)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2d3a;border-radius:8px}
.hidden{display:none!important}
svg{flex:0 0 auto}

/* layout */
.app{display:flex;min-height:100vh}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:80;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.brand{padding:26px 22px 22px;font-size:1.4rem;font-weight:900;letter-spacing:-.02em;border-bottom:1px solid var(--line)}
.brand span{color:var(--red2)}
.navwrap{flex:1;overflow-y:auto;padding:18px 10px}
.navlabel{font-size:.66rem;letter-spacing:.14em;color:var(--mut2);font-weight:800;padding:0 12px 10px}
.nav-item{position:relative;display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;color:#aeb2c4;padding:11px 14px;border-radius:10px;font-weight:600;font-size:.88rem;cursor:pointer;text-align:left;transition:.2s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.on{color:var(--red2);background:linear-gradient(90deg,rgba(220,38,38,.2),rgba(220,38,38,.02))}
.nav-item.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--red2)}
.nav-badge{margin-left:auto;font-size:.62rem;font-weight:900;padding:3px 7px;border-radius:99px;background:#f97316;color:#1a0d00}
.usercard{margin:10px;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}
.usercard:hover{border-color:var(--line2)}
.usercard b{display:block;font-size:.9rem}.usercard small{color:var(--red2);font-size:.74rem}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ef1111,#b91c1c);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:70;opacity:0;pointer-events:none;transition:.3s}
#overlay.show{opacity:1;pointer-events:auto}
.main{flex:1;min-width:0;margin-left:var(--side-w)}
.mtop{display:none;position:sticky;top:0;z-index:50;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(10,12,22,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.mtop .hb{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px}
.mtop .brand{border:0;padding:0;font-size:1.25rem;margin-right:auto;margin-left:28px}
.content{max-width:1240px;margin:0 auto;padding:34px 32px 80px}
.page{display:none}.page.on{display:block;animation:pin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(10px)}}

/* títulos */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.ph h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em}
.ph p{color:var(--mut);margin-top:6px;font-size:.92rem}
.ph p b{color:var(--red2);font-weight:600}
.modbadge{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:.8rem}
.modbadge svg{color:var(--red2)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-size:.74rem;font-weight:700;border:1px solid var(--line);background:var(--card);white-space:nowrap;color:var(--mut)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut2)}
.pill.ok{color:var(--ok)}.pill.ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.warn{color:var(--warn)}.pill.warn::before{background:var(--warn)}
.pill.err{color:var(--err)}.pill.err::before{background:var(--err)}
.pill.load::before{background:var(--info);animation:pls 1s infinite}
@keyframes pls{50%{opacity:.3}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:18px}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.card .sub{color:var(--mut);font-size:.84rem;margin-bottom:16px;line-height:1.55}
.cardhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.cardhead h2{margin:0}
.icobox{width:46px;height:46px;border-radius:12px;background:rgba(220,38,38,.14);border:1px solid rgba(220,38,38,.25);color:#f87171;display:grid;place-items:center;flex:0 0 auto}
.num{width:30px;height:30px;border-radius:8px;background:rgba(220,38,38,.18);border:1px solid rgba(220,38,38,.3);color:var(--red2);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:0 0 auto}
.center{text-align:center}.muted{color:var(--mut)}.mt{margin-top:14px}.mt2{margin-top:22px}
.hint{color:var(--mut);font-size:.8rem;line-height:1.55;margin-top:8px}
.subbox{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.subbox h3{font-size:.9rem;font-weight:700;margin-bottom:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stat .si{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:18px;background:var(--bgc);color:var(--fc);border:1px solid var(--bdc)}
.stat .n{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--mut);font-size:.8rem;margin-top:2px}
.stat.hl{background:linear-gradient(135deg,rgba(220,38,38,.16),rgba(220,38,38,.03));border-color:rgba(220,38,38,.35)}
.stat.hl .l{color:#f87171}
.stat .ghost{position:absolute;right:-8px;top:-8px;opacity:.07;color:#fff}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.qa{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;transition:.2s;width:100%}
.qa:hover{border-color:var(--line2);transform:translateY(-2px)}
.qa .qi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--bgc);color:var(--fc)}
.qa b{display:block;font-size:.92rem}.qa small{color:var(--mut);font-size:.76rem}
.qa .ar{margin-left:auto;color:var(--mut2)}

/* tabela */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);font-weight:800;text-align:left;padding:18px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.15s}tbody tr:hover{background:rgba(255,255,255,.025)}
.thumb{width:44px;height:62px;border-radius:8px;object-fit:cover;background:#1a1c26;display:block}
td .tt{font-weight:600;font-size:.95rem}
td .tm{color:#60a5fa;font-size:.8rem;margin-top:3px}
td.yr{color:var(--mut);font-size:1rem}
.acts{display:flex;gap:8px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:#cbd0e2;display:grid;place-items:center;cursor:pointer;transition:.2s}
.ib:hover{border-color:var(--line2);color:#fff}.ib.dng:hover{background:rgba(239,68,68,.2);color:#fca5a5;border-color:rgba(239,68,68,.4)}
.tag{display:inline-block;font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:7px}
.tag.s{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.tag.m{background:rgba(37,99,235,.15);color:#60a5fa;border:1px solid rgba(37,99,235,.3)}
.tag.a{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.3)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:#22c55e}.st.part{color:var(--warn)}.st.none{color:var(--err)}
.tblhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 20px;border-bottom:1px solid var(--line)}
.tblhead h2{font-size:1.05rem;font-weight:800;margin:0}
.moreline{text-align:center;padding:16px}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}.empty .big{font-size:2.4rem;margin-bottom:6px}

/* campos */
label{display:block;font-size:.76rem;color:var(--mut);margin-bottom:7px;font-weight:700;letter-spacing:.02em}
label.up{text-transform:uppercase;letter-spacing:.08em;font-size:.7rem}
.inp,input,select,textarea{width:100%;padding:14px 16px;background:var(--inp);border:1px solid var(--inpb);border-radius:12px;outline:none;transition:.2s;color:#fff}
input::placeholder,textarea::placeholder{color:#4b5470}
input:focus,select:focus,textarea:focus{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}
input:disabled,input[readonly]{opacity:.6}
select option{background:#111827}
textarea{resize:vertical;min-height:120px}
.search{position:relative}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut2);pointer-events:none}
.search input{padding-left:46px}
.field{margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.row.nofl>*{flex:0 0 auto}
.fld-eye{position:relative}.fld-eye button{position:absolute;right:6px;bottom:6px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;border:0;padding:14px 22px;border-radius:12px;font-weight:700;font-size:.92rem;cursor:pointer;transition:.2s;white-space:nowrap;box-shadow:0 8px 24px rgba(220,38,38,.2)}
.btn:hover{background:#ef2b2b;transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.blue{background:var(--blue);box-shadow:0 8px 24px rgba(37,99,235,.2)}.btn.blue:hover{background:#3b72f0}
.btn.green{background:var(--green);box-shadow:0 8px 24px rgba(5,150,105,.25)}.btn.green:hover{background:#06ad7c}
.btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:#e5e7eb}.btn.ghost:hover{border-color:var(--line2);background:#1d2030}
.btn.amber{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#fbbf24;box-shadow:none}
.btn.cyan{background:var(--card2);border:1px solid var(--line);color:#e5e7eb;box-shadow:none}.btn.cyan svg{color:#22d3ee}
.btn.sm{padding:9px 14px;font-size:.78rem;border-radius:10px}
.btn:disabled{opacity:.5;pointer-events:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lnk{background:none;border:0;color:#f87171;cursor:pointer;font-weight:600;font-size:.85rem;opacity:.85}
.lnk:hover{opacity:1;text-decoration:underline}
.backbtn{display:inline-flex;align-items:center;gap:10px;background:none;border:0;color:var(--mut);cursor:pointer;padding:8px 14px;margin:0 0 14px -6px;font-weight:600}
.backbtn:hover{color:#fff}

/* abas editor */
.etabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.etab{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:14px 20px;font-weight:600;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.etab.on{color:#f87171;border-bottom-color:#ef4444}
.etab:hover{color:#fff}.etab.on:hover{color:#f87171}

/* poster */
.pbox{aspect-ratio:2/3;max-width:420px;margin:0 auto 22px;background:#1f2937;border:2px dashed #374151;border-radius:16px;display:grid;place-items:center;color:#4b5563;overflow:hidden;text-align:center}
.pbox img{width:100%;height:100%;object-fit:cover;display:block}
.pbox span{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.9rem}
.tmdbbox{background:#0f1426;border:1px solid #1e2a5a;border-radius:14px;padding:18px;margin-bottom:20px}
.tmdbbox h4{color:#60a5fa;font-size:.82rem;letter-spacing:.06em;margin-bottom:12px}
.tmdbbox .btn{margin-top:12px}

/* temporadas */
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.acc>button.ah{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:20px 22px;font-weight:700;font-size:1.05rem;cursor:pointer;text-align:left}
.acc>button.ah svg{transition:.25s;color:var(--mut)}
.acc.open>button.ah svg{transform:rotate(180deg)}
.acc .ab{display:none;background:#0e1322;padding:14px;border-top:1px solid var(--line)}
.acc.open .ab{display:block}
.eprow{display:flex;align-items:center;gap:12px;background:#10162a;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.eprow .en{width:30px;height:30px;border-radius:50%;background:rgba(220,38,38,.2);color:#f87171;display:grid;place-items:center;font-weight:800;font-size:.78rem;flex:0 0 auto}
.eprow .et{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-src{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;font-size:.82rem;font-weight:700;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:#34d399;white-space:nowrap}
.badge-src.no{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#fbbf24}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{background:var(--card2);border:1px solid var(--line);padding:10px 15px;font-size:.8rem;border-radius:10px;cursor:pointer;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--red);color:#fff;border-color:transparent}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:12px;max-height:230px;overflow:auto}
.chip{padding:9px 0;text-align:center;border-radius:10px;font-size:.78rem;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut);cursor:pointer}
.chip.has{color:#6ee7b7;border-color:rgba(16,185,129,.35)}
.chip.sel{background:var(--red);color:#fff;border-color:transparent}
.savebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;bottom:14px;z-index:20;padding:12px;background:rgba(13,15,22,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;margin-top:18px}
.savebar .btn{flex:1;min-width:140px}
.dirty{color:var(--warn);font-size:.8rem;font-weight:700}

/* importar */
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--inp);border:1px solid var(--inpb);border-radius:12px;padding:5px;gap:5px}
.seg2 button{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:0;padding:11px;border-radius:9px;color:var(--mut);font-weight:700;cursor:pointer}
.seg2 button.on{background:var(--red);color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.seg2.c3{grid-template-columns:repeat(3,1fr)}
.seg2.c3 button{font-size:.85rem;padding:11px 6px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.scard img,.scard .noimg{width:100%;aspect-ratio:2/3;object-fit:cover;background:#1a1c26;display:grid;place-items:center;color:var(--mut2)}
.scard .si{padding:12px;flex:1}.scard .si b{display:block;font-size:.85rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .si small{color:var(--mut);font-size:.74rem}
.scard .btn{margin:0 12px 12px}
.bigempty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);padding:50px 20px;text-align:center}
.bigempty .bi{width:84px;height:84px;border-radius:50%;background:rgba(220,38,38,.12);color:#f87171;display:grid;place-items:center;margin:0 auto 16px}
.bigempty h3{font-size:1.3rem;margin-bottom:6px}.bigempty p{color:var(--mut)}

/* automatizar */
.switchrow{display:flex;align-items:center;gap:12px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.25);border-radius:14px;padding:16px;margin-top:16px;cursor:pointer}
.switchrow input{width:20px;height:20px;accent-color:#10b981;flex:0 0 auto;padding:0}
.switchrow b{font-size:.9rem}
.inspector{background:#0b0d14;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;line-height:1.7;word-break:break-all}
.inspector .ih{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:.82rem;text-transform:uppercase;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.inspector .ih span{font-weight:600;text-transform:none;color:#34d399;font-size:.78rem}
.inspector .ih span.bad{color:#f87171}
.inspector .k{color:var(--mut)}.inspector .g{color:#34d399}.inspector .w{color:#fff}
.progress{height:8px;border-radius:8px;background:#1b1e2a;overflow:hidden;margin:14px 0}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,#059669,#34d399);border-radius:8px;transition:width .4s}
.log{font-family:ui-monospace,Menlo,monospace;font-size:.76rem;line-height:1.65;max-height:300px;overflow-y:auto;background:#0b0d14;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;display:none;color:var(--mut)}
.log.show{display:block}
.log .s{color:#34d399;font-weight:600}.log .e{color:#f87171;font-weight:600}.log .w{color:#fbbf24;font-weight:600}.log .i{color:#60a5fa}.log .t{color:#f87171;font-weight:800;text-transform:uppercase;margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
.sugg{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sugg button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:.86rem}
.sugg button:hover{border-color:var(--line2)}
.selchip{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);color:#34d399;padding:7px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
.previewbox{background:#0b0d14;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;max-height:260px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:.74rem;line-height:1.7;color:#34d399;word-break:break-all}
.mp{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:8px}
.mo{background:var(--inp);border:2px solid var(--inpb);border-radius:10px;padding:8px;text-align:center;cursor:pointer;font-size:.72rem;font-weight:800;color:var(--mut)}
.mo b{display:block;font-size:1rem;color:#fff}
.mo.on{border-color:var(--ok);background:rgba(16,185,129,.12);color:var(--ok)}.mo.on b{color:var(--ok)}

const getTmdbToken = () => { try { return localStorage.getItem("kiraflix_tmdb") || DEFAULT_TMDB_TOKEN; } catch (e) { return DEFAULT_TMDB_TOKEN; } };
async function tmdb(path) {
  const tk = getTmdbToken();
  const isKey = tk.length < 60;
  const url = "https://api.themoviedb.org/3" + path + (isKey ? (path.includes("?") ? "&" : "?") + "api_key=" + encodeURIComponent(tk) : "");
  const r = await fetch(url, { headers: isKey ? { accept: "application/json" } : { Authorization: "Bearer " + tk, accept: "application/json" } });
  if (r.status === 401) throw new Error("Token do TMDB inválido (veja em Importar Mídia)");
  if (!r.ok) throw new Error("TMDB respondeu " + r.status);
  return r.json();
}
async function buildFromTmdb(kind, id, onProg) {
  const ep = KINDS[kind].tmdb;
  const data = await tmdb(`/${ep}/${id}?language=${LANG}`);
  let ageRating = "";
  try {
    const d2 = await tmdb(ep === "movie" ? `/movie/${id}/release_dates` : `/tv/${id}/content_ratings`);
    const br = (d2.results || []).find(x => x.iso_3166_1 === "BR");
    if (br) ageRating = ep === "movie" ? (br.release_dates?.[0]?.certification || "") : (br.rating || "");
  } catch (e) {}
  const base = {
    title: data.title || data.name || "",
    overview: data.overview || "",
    poster: data.poster_path ? `https://image.tmdb.org/t/p/w500${data.poster_path}` : "",
    backdrop: data.backdrop_path ? `https://image.tmdb.org/t/p/original${data.backdrop_path}` : "",
    year: (data.release_date || data.first_air_date || "").slice(0, 4),
    rating: data.vote_average || 0,
    genres: (data.genres || []).map(g => g.name),
    ageRating
  };
  if (ep === "movie") return { base };
  const seasons = [];
  const list = (data.seasons || []).filter(s => s.season_number > 0);
  let i = 0;
  for (const s of list) {
    i++; if (onProg) onProg(i, list.length);
    const sd = await tmdb(`/tv/${id}/season/${s.season_number}?language=${LANG}`);
    seasons.push({
      number: s.season_number,
      label: s.name || `Temporada ${s.season_number}`,
      episodes: (sd.episodes || []).map(e => ({ number: e.episode_number, label: `Episódio ${e.episode_number}`, title: e.name || "", source: "", subtitles: {} }))
    });
  }
  return { base, seasons };
}
function mergeSeasons(tm, existing) {
  const ex = new Map((existing || []).map(s => [s.number, s]));
  const out = (tm || []).map(ts => {
    const es = ex.get(ts.number);
    if (!es) return ts;
    ex.delete(ts.number);
    const em = new Map((es.episodes || []).map(e => [e.number, e]));
    const eps = ts.episodes.map(te => {
      const ee = em.get(te.number);
      if (!ee) return te;
      em.delete(te.number);
      return { ...te, ...ee, title: ee.title || te.title, label: ee.label || te.label };
    });
    em.forEach(e => eps.push(e));
    eps.sort((a, b) => a.number - b.number);
    return { ...ts, ...es, label: es.label || ts.label, episodes: eps };
  });
  ex.forEach(s => out.push(s));
  out.sort((a, b) => a.number - b.number);
  return out;
}

const bucketOf = (cat, kind) => cat[KINDS[kind].bucket] || (cat[KINDS[kind].bucket] = {});
function countEntries(c) { return ["movies", "series", "animes"].reduce((n, b) => n + Object.keys((c && c[b]) || {}).length, 0); }
function getGithubConfig() {
  try { const c = JSON.parse(localStorage.getItem("kiraflix_gh") || "null"); return c && c.owner && c.repo && c.token ? c : null; } catch (e) { return null; }
}
function saveGithubConfig() {
  const cfg = { owner: $("ghOwner").value.trim(), repo: $("ghRepo").value.trim(), token: $("ghToken").value.trim() };
  if (!cfg.owner || !cfg.repo || !cfg.token) return toast("Preencha os 3 campos", true);
  try { localStorage.setItem("kiraflix_gh", JSON.stringify(cfg)); } catch (e) { return toast("Não consegui salvar neste navegador", true); }
  toast("✔ GitHub configurado"); reloadCatalog(false);
}
async function testGithubConnection() {
  const cfg = getGithubConfig(); if (!cfg) return toast("Salve a configuração primeiro.", true);
  const b = $("btnTest"); b.innerHTML = '<span class="spin"></span> Testando';
  try {
    const h = { Authorization: `token ${cfg.token}`, Accept: "application/vnd.github.v3+json" };
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`, { headers: h });
    if (res.status === 401) throw new Error("Token inválido (401)");
    if (res.status === 404) throw new Error("Repositório não encontrado (404)");
    if (!res.ok) throw new Error("Erro " + res.status);
    const c = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/catalog.json`, { headers: h });
    if (c.status === 404) toast("✔ Repo ok! O catalog.json será criado.", "info"); else if (!c.ok) throw new Error("Erro lendo catalog.json: " + c.status); else toast("✔ Conexão funcionando.");
  } catch (e) { toast("❌ " + e.message, true); }
  finally { b.innerHTML = ic("check") + " Testar conexão"; }
}
function saveTmdbToken() {
  const v = $("tmdbTok").value.trim();
  try { if (v) localStorage.setItem("kiraflix_tmdb", v); else localStorage.removeItem("kiraflix_tmdb"); } catch (e) { return toast("Não consegui salvar", true); }
  toast(v ? "✔ Token do TMDB salvo" : "Token padrão restaurado");
}
function updateConn(s, t) { connState = { s, t }; const p = $("connPill"); if (p) { p.className = "pill " + s; p.textContent = t; } }

async function readCatalogFromGithub(cfg) {
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/catalog.json`;
  const h = { Authorization: `token ${cfg.token}` };
  const meta = await fetch(url, { headers: { ...h, Accept: "application/vnd.github.v3+json" }, cache: "no-store" });
  if (meta.status === 404) return { data: { movies: {}, series: {}, animes: {}, reels: {} }, sha: null };
  if (meta.status === 401) throw new Error("Token do GitHub inválido (401)");
  if (!meta.ok) throw new Error("HTTP " + meta.status);
  const file = await meta.json();
  let text = "";
  if (file.content && file.encoding === "base64") text = decodeURIComponent(escape(atob(file.content.replace(/\n/g, ""))));
  else {
    const raw = await fetch(url, { headers: { ...h, Accept: "application/vnd.github.raw" }, cache: "no-store" });
    if (!raw.ok) throw new Error("HTTP " + raw.status + " ao baixar catalog.json");
    text = await raw.text();
  }
  text = text.replace(/^\uFEFF/, "");
  if (!text.trim()) throw new Error("catalog.json veio vazio do GitHub (nada foi salvo)");
  const data = JSON.parse(text);
  ["movies", "series", "animes", "reels"].forEach(k => { if (!data[k]) data[k] = {}; });
  return { data, sha: file.sha };
}
function backupLocal(d) { try { localStorage.setItem("kiraflix_backup", JSON.stringify({ t: Date.now(), count: countEntries(d), json: JSON.stringify(d) })); } catch (e) {} }
function downloadBackup() {
  let b = null; try { b = JSON.parse(localStorage.getItem("kiraflix_backup") || "null"); } catch (e) {}
  if (!b) return toast("Ainda não há backup local", "warn");
  downloadBlob(b.json, "catalog-backup.json", "application/json");
  toast(`💾 Backup de ${new Date(b.t).toLocaleString()} (${b.count} itens)`);
}
function setCatalog(data, sha, ro) {
  catalog = data; catalogSha = sha; catalogLoaded = true; catalogReadOnly = !!ro;
  catalogCountAtLoad = countEntries(data); libCache = {};
  updateConn(ro ? "warn" : "ok", (ro ? "Somente leitura · " : "GitHub · ") + catalogCountAtLoad.toLocaleString("pt-BR") + " títulos");
  refreshPage();
}
async function loadCatalogAny() {
  const cfg = getGithubConfig();
  if (cfg) { const r = await readCatalogFromGithub(cfg); setCatalog(r.data, r.sha, false); backupLocal(r.data); return; }
  const res = await fetch("catalog.json?v=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("catalog.json do site não encontrado (configure o GitHub em Importar Mídia)");
  const data = JSON.parse(limparInvisiveis(await res.text()));
  ["movies", "series", "animes", "reels"].forEach(k => { if (!data[k]) data[k] = {}; });
  setCatalog(data, null, true);
}
async function ensureCatalog() { if (!catalogLoaded) { try { await loadCatalogAny(); } catch (e) {} } }
async function reloadCatalog(show) {
  updateConn("load", "Carregando…");
  try { await loadCatalogAny(); if (show) toast(`✔ Catálogo atualizado (${catalogCountAtLoad} títulos)`); }
  catch (e) { updateConn("err", "Erro ao carregar"); toast("Não consegui carregar o catálogo: " + e.message, "warn"); refreshPage(); }
}
// ÚNICO caminho de gravação: relê, altera só o necessário, confere, grava
async function commitCatalog(message, mutate, opts = {}) {
  const cfg = getGithubConfig();
  if (!cfg) throw new Error("GitHub não configurado (veja em Importar Mídia)");
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/catalog.json`;
  for (let attempt = 0; attempt < 3; attempt++) {
    const fresh = await readCatalogFromGithub(cfg);
    const before = countEntries(fresh.data);
    if (before === 0 && catalogCountAtLoad > 0) throw new Error("Proteção: o GitHub devolveu o catálogo vazio. Nada foi salvo.");
    if (fresh.sha === null && catalogSha) throw new Error("Proteção: o catalog.json sumiu do repositório. Nada foi salvo.");
    backupLocal(fresh.data);
    mutate(fresh.data);
    const after = countEntries(fresh.data);
    if (after < before - (opts.allowShrink || 0)) throw new Error(`Proteção: esse salvamento apagaria ${before - after} itens. Cancelado.`);
    const jsonStr = limparInvisiveis(JSON.stringify(fresh.data, null, 2));
    JSON.parse(jsonStr);
    const body = { message, content: btoa(unescape(encodeURIComponent(jsonStr))) };
    if (fresh.sha) body.sha = fresh.sha;
    const put = await fetch(url, { method: "PUT", headers: { Authorization: `token ${cfg.token}`, Accept: "application/vnd.github.v3+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if ((put.status === 409 || put.status === 422) && attempt < 2) { await sleep(600); continue; }
    if (!put.ok) { let m = ""; try { m = (await put.json()).message || ""; } catch (e) {} throw new Error(`GitHub ${put.status}${m ? ": " + m : ""}`); }
    let ns = null; try { ns = (await put.json()).content.sha; } catch (e) {}
    setCatalog(fresh.data, ns, false);
    return fresh.data;
  }
  throw new Error("Conflito ao salvar. Tente novamente.");
}

function statusOf(kind, item) {
  if (!isTV(kind)) { const has = !!(item && item.source); return { total: 1, withSrc: has ? 1 : 0, state: has ? "ok" : "none", link: has ? item.source : "" }; }
  let total = 0, w = 0, link = "";
  ((item && item.seasons) || []).forEach(s => (s.episodes || []).forEach(e => { total++; if (e.source) { w++; if (!link) link = e.source; } }));
  return { total, withSrc: w, state: total && w === total ? "ok" : (w > 0 ? "part" : "none"), link };
}

function allItems() {
  const out = [];
  for (const kind of Object.keys(KINDS)) for (const [id, it] of Object.entries(bucketOf(catalog, kind))) out.push({ kind, id, it });
  return out;
}
let dashQ = "";
function countLinks() {
  let movies = 0, eps = 0, titles = 0;
  for (const m of Object.values(catalog.movies || {})) if (m.source) { movies++; titles++; }
  for (const k of ["series", "animes"]) for (const sv of Object.values(catalog[k] || {})) {
    let c = 0; (sv.seasons || []).forEach(se => (se.episodes || []).forEach(e => { if (e.source) c++; }));
    if (c) { eps += c; titles++; }
  }
  return { movies, eps, titles, total: movies + eps };
}

function dashRows() {
  const q = dashQ.trim().toLowerCase();
  let list = allItems();
  if (q) list = list.filter(x => (x.it.title || "").toLowerCase().includes(q) || x.id.includes(q));
  list.sort((a, b) => (b.it.addedAt || 0) - (a.it.addedAt || 0) || (parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0));
  list = list.slice(0, 8);
  const body = $("dashBody"); if (!body) return;
  if (!list.length) { body.innerHTML = `<tr><td colspan="4"><div class="empty"><div class="big">🎞️</div>${catalogLoaded ? "Nada por aqui ainda." : "Carregando catálogo…"}</div></td></tr>`; return; }
  body.innerHTML = list.map(({ kind, id, it }) => {
    const s = statusOf(kind, it);
    const tag = kind === "movie" ? '<span class="tag m">Filme</span>' : kind === "series" ? '<span class="tag s">Série</span>' : '<span class="tag a">Anime</span>';
    const stl = s.state === "ok" ? '<span class="st ok">Online</span>' : s.state === "part" ? `<span class="st part">${s.withSrc}/${s.total}</span>` : '<span class="st none">Sem fonte</span>';
    return `<tr style="cursor:pointer" onclick="openEditor('${kind}','${esc(id)}')"><td><div style="display:flex;gap:14px;align-items:center">${thumbImg(it.poster)}<div><div class="tt">${esc(it.title || "(sem título)")}</div><div class="tm" style="color:var(--mut2)">TMDB: ${esc(id)}</div></div></div></td><td>${tag}</td><td style="color:var(--mut);font-size:.88rem;white-space:nowrap">${ago(it.addedAt)}</td><td>${stl}</td></tr>`;
  }).join("");
}
function thumbImg(p) { const t = p ? p.replace("/w500/", "/w185/") : ""; return `<img class="thumb" loading="lazy" src="${esc(t)}" alt="" onerror="this.style.visibility='hidden'">`; }

function libSorted(kind) {
  if (libCache[kind]) return libCache[kind];
  const out = Object.entries(bucketOf(catalog, kind)).map(([id, it]) => ({ id, it, key: (it.title || "").toLowerCase() }));
  out.sort((a, b) => (b.it.addedAt || 0) - (a.it.addedAt || 0) || (parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0));
  return libCache[kind] = out;
}
function renderLib(kind) {
  const secId = kind === "movie" ? "p-movies" : kind === "series" ? "p-series" : "p-animes";
  const name = { movie: ["Biblioteca de Filmes", "Gerencie fontes dos filmes", "Buscar filme..."], series: ["Biblioteca de Séries", "Gerencie as séries e adicione fontes.", "Buscar série..."], anime: ["Biblioteca de Animes", "Gerencie os animes e adicione fontes.", "Buscar anime..."] }[kind];
  const st = libState[kind];
  const sec = $(secId);
  if (!sec.dataset.built) {
    sec.dataset.built = "1";
    sec.innerHTML = `<div class="ph"><div><h1>${name[0]}</h1><p>${name[1]}</p></div></div>
      <div class="search field">${ic("search", 18)}<input id="lq-${kind}" placeholder="${name[2]}" autocomplete="off" oninput="libState['${kind}'].q=this.value;libState['${kind}'].limit=50;libRows('${kind}')"></div>
      <button class="btn block" style="margin-bottom:${kind === "series" ? "10px" : "22px"}" onclick="openEditor('${kind}')">${ic("plus", 20)} Adicionar</button>${kind === "series" ? `<button class="btn ghost block" style="margin-bottom:22px" onclick="detectAnimes()">🎌 Separar animes automaticamente</button>` : ""}
      <div class="tblwrap"><div class="tbl-scroll"><table><thead><tr><th>Poster</th><th>Informações</th><th>Ano</th>${kind === "movie" ? "<th>Fonte</th>" : ""}<th>Ação</th></tr></thead><tbody id="lb-${kind}"></tbody></table></div><div class="moreline hidden" id="lm-${kind}"><button class="btn ghost" onclick="libState['${kind}'].limit+=50;libRows('${kind}')">Carregar mais</button></div></div>
      <div class="muted center mt" id="lc-${kind}" style="font-size:.8rem"></div>`;
    $("lb-" + kind).addEventListener("click", e => {
      const b = e.target.closest("button[data-act]"); if (!b) return;
      const id = b.closest("tr").dataset.id;
      if (b.dataset.act === "edit") openEditor(kind, id); else if (b.dataset.act === "move") moveItem(kind, kind === "series" ? "anime" : "series", id); else deleteItem(kind, id);
    });
  }
  $("lq-" + kind).value = st.q;
  libRows(kind);
}
function libRows(kind) {
  const body = $("lb-" + kind); if (!body) return;
  const st = libState[kind], q = st.q.trim().toLowerCase();
  const all = libSorted(kind);
  const list = q ? all.filter(x => x.key.includes(q) || x.id.includes(q)) : all;
  if (!catalogLoaded) { body.innerHTML = `<tr><td colspan="5"><div class="empty">Carregando catálogo…</div></td></tr>`; return; }
  if (!list.length) { body.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="big">🎞️</div>${all.length ? "Nada encontrado." : "Ainda não há nada aqui. Clique em Adicionar."}</div></td></tr>`; $("lm-" + kind).classList.add("hidden"); $("lc-" + kind).textContent = ""; return; }
  body.innerHTML = list.slice(0, st.limit).map(({ id, it }) => {
    const s = statusOf(kind, it);
    return `<tr data-id="${esc(id)}"><td>${thumbImg(it.poster)}</td><td><div class="tt">${esc(it.title || "(sem título)")}</div><div class="tm">TMDB: ${esc(id)}</div></td><td class="yr">${esc(it.year || "")}</td>${kind === "movie" ? `<td><span class="st ${s.state === "ok" ? "ok" : "none"}">${s.state === "ok" ? "Com fonte" : "Sem fonte"}</span></td>` : ""}<td><div class="acts">${kind !== "movie" ? `<button class="ib" data-act="move" title="${kind === "series" ? "Mover para Animes" : "Mover para Séries"}">${ic("swap", 16)}</button>` : ""}<button class="ib" data-act="edit" title="Editar">${ic("edit", 16)}</button><button class="ib dng" data-act="del" title="Excluir">${ic("trash", 16)}</button></div></td></tr>`;
  }).join("");
  $("lm-" + kind).classList.toggle("hidden", list.length <= st.limit);
  $("lc-" + kind).textContent = `${Math.min(st.limit, list.length).toLocaleString("pt-BR")} de ${list.length.toLocaleString("pt-BR")} títulos`;
}
async function moveItem(from, to, id) {
  const it = bucketOf(catalog, from)[id]; const name = it?.title || id; const dest = to === "anime" ? "Animes" : "Séries";
  if (!await askConfirm(`Mover para ${dest}?`, `“${name}” vai para a aba ${dest}.`, "Mover")) return;
  try { await commitCatalog(`Move ${name}`, cat => { const f = bucketOf(cat, from), t = bucketOf(cat, to); if (f[id]) { t[id] = f[id]; delete f[id]; } }); toast(`✔ Movido para ${dest}`); }
  catch (e) { toast("Erro: " + e.message, true); }
}
async function detectAnimes() {
  await ensureCatalog();
  if (catalogReadOnly || !getGithubConfig()) return toast("Conecte o GitHub em Minha Conta primeiro", "warn");
  const cands = Object.entries(catalog.series).filter(([id, x]) => /^\d+$/.test(id) && (!(x.genres || []).length || (x.genres || []).some(g => /anima/i.test(g)))).map(([id]) => id);
  if (!cands.length) return toast("Nenhum candidato a anime nas séries", "info");
  openModal(`<h3>Procurando animes…</h3><p id="dtP">0 / ${cands.length}</p><div class="progress"><b id="dtB"></b></div><button class="btn ghost block" id="dtX">Cancelar</button>`);
  let stop = false, done = 0; const found = [], q = cands.slice();
  $("dtX").onclick = () => { stop = true; closeModal(); };
  const worker = async () => {
    while (q.length && !stop) {
      const id = q.shift();
      try { const d = await tmdb(`/tv/${id}`); if ((d.origin_country || []).includes("JP") && (d.genres || []).some(g => g.id === 16)) found.push(id); } catch (e) {}
      done++; const pe = $("dtP"); if (pe) { pe.textContent = `${done} / ${cands.length} · ${found.length} animes`; $("dtB").style.width = Math.round(done / cands.length * 100) + "%"; }
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  if (stop) return;
  if (!found.length) { closeModal(); return toast("Nenhum anime encontrado nas séries", "info"); }
  const names = found.slice(0, 12).map(id => "• " + (catalog.series[id]?.title || id)).join("\n");
  closeModal();
  if (!await askConfirm(`Mover ${found.length} anime(s) para a aba Animes?`, names + (found.length > 12 ? `\n… e mais ${found.length - 12}` : ""), "Mover")) return;
  try {

function getTargetSeasons() { const sel = $("targetSeason"); if (!sel) return []; const v = sel.value; if (v === "all") return ed.seasons; const s = ed.seasons[parseInt(v, 10)]; return s ? [s] : []; }

function detectarVariaveis() {
  let url = $("exampleUrl").value.trim(); if (!url) return toast("Cole um link de exemplo", true);

  const r1 = /((?:Season|Temporada)[-_ ]?)(\d+)(\/)(\d+)/i;

  else { const r2 = /\/(\d+)\/(\d+)(\/|$|\?)/; if (r2.test(url)) url = url.replace(r2, '/{season}/{episode}$3'); else { const r3 = /\/(\d+)(\/|$|\?)/; if (r3.test(url)) url = url.replace(r3, '/{episode}$2'); } }

function aplicarLinks(clear) {

      if (!inSel(ep.number)) return;

      const n = nm === "tmdb" ? ep.number : counter++;

}

  if ((m = html.match(/"file"\s*:\s*"([^"]+\.mp4[^"]*)"/i))) return { url: m[1].replace(/\\\//g, "/"), tipo: '"file":' };
  if ((m = html.match(/https?:\/\/[^"'\s\\]+?\.(?:mp4|m3u8)(?:\?[^"'\s\\]*)?/i))) return { url: m[0], tipo: "MP4/HLS Direto" };
  if ((m = html.match(/<iframe[^>]+(?:src|data-src|data-lazy-src)=["']([^"']+)["']/i))) { let u = m[1]; if (u.startsWith("//")) u = "https:" + u; return { url: u, tipo: "Iframe Embed" }; }
  if ((m = html.match(/["'](?:video_url|file_url|stream_url|source_url|videoUrl|fileUrl)["']\s*:\s*["']([^"']+)["']/i))) return { url: m[1].replace(/\\\//g, "/"), tipo: "JSON Interno" };
  if ((m = html.match(/data-(?:src|url|video|file|stream|source)\s*=\s*["']([^"']+\.(?:mp4|m3u8)[^"']*)["']/i))) return { url: m[1], tipo: "Data Attribute" };
  if ((m = html.match(/<source[^>]+src\s*=\s*["']([^"']+)["']/i))) return { url: m[1], tipo: "Source Tag" };
  return { url: fb, tipo: "Fallback Página" };
}
async function autoScrapeTudo() {
  let initialUrl = $("scrapeUrl").value.trim();
  if (!initialUrl) return toast("Cole o link da série", true);
  if (!autoSel) return toast("Escolha a série/anime no passo 1 (Automação de Episódios)", true);
  if (catalogReadOnly || !getGithubConfig()) return toast("Configure o GitHub em Importar Mídia para salvar", "warn");
  initialUrl = rawOf(initialUrl);
  const { kind, id } = autoSel, item = bucketOf(catalog, kind)[id];
  const work = JSON.parse(JSON.stringify(item.seasons || []));
  const maxS = work.length ? Math.max(...work.map(s => s.number)) : 1;
  const shouldPrefix = $("scrapePrefix").value === "yes";
  $("scrapeLog").innerHTML = ""; const btn = $("btnScrape"); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Raspando...';
  let domain; try { domain = new URL(initialUrl).origin; } catch (e) { toast("Link inválido", true); btn.disabled = false; btn.innerHTML = "🕷️ Varrer Tudo"; return; }
  const urlBase = initialUrl.replace(/\/\d+\/?$/, "").replace(/-Season-\d+$/i, "").replace(/-Temporada-\d+$/i, "");
  const slug = (urlBase.match(/\/([^\/]+)$/) || [])[1] || ""; const hashPrefix = slug.substring(0, 8);
  logTo("scrapeLog", `🕷️ Iniciando raspagem em: ${domain}`, "title"); logTo("scrapeLog", `📌 Slug base: ${slug}`, "info");
  const seasonUrls = {};
  try {
    const res = await fetchWithProxy(initialUrl);
    if (res) {
      const html = await res.text(); logTo("scrapeLog", `✅ HTML baixado (${html.length} bytes)`, "success");
      const re = /href=["']([^"']+)["']/gi; let m;
      while ((m = re.exec(html)) !== null) {
        let u = m[1]; if (u.startsWith("/")) u = domain + u; if (!u.startsWith("http")) continue;
        const clean = u.replace(/\/\d+\/?$/, "").replace(/\/+$/, "");
        if (hashPrefix && clean.includes(hashPrefix)) {
          let sn = 1; const sm = clean.match(/-Season-(\d+)/i) || clean.match(/-Temporada-(\d+)/i); if (sm) sn = parseInt(sm[1], 10);
          if (sn <= maxS && !seasonUrls[sn]) { seasonUrls[sn] = clean; logTo("scrapeLog", `🔗 T${sn}: ${clean}`, "success"); }
        }
      }
    }
  } catch (e) { logTo("scrapeLog", `⚠️ Falha ao ler HTML: ${e.message}`, "warn"); }
  logTo("scrapeLog", "💪 Força bruta para temporadas faltantes...", "title");
  const patterns = [s => s === 1 ? urlBase : `${urlBase}-Season-${s}`, s => s === 1 ? urlBase : `${urlBase}-Temporada-${s}`, s => `${urlBase}/${s}`, s => `${urlBase}/temporada-${s}`, s => `${urlBase}/tp/${s}`];
  for (let s = 1; s <= maxS; s++) {
    if (seasonUrls[s]) continue;
    for (const p of patterns) {
      try { const res = await fetchWithProxy(p(s) + "/1"); if (res) { const t = await res.text(); if (t.length > 1000 && !t.match(/<title>.*404.*<\/title>/i)) { seasonUrls[s] = p(s); logTo("scrapeLog", `✔️ T${s}: ${p(s)}`, "success"); break; } } } catch (e) {}
    }
  }
  let total = 0;
  for (let s = 1; s <= maxS; s++) {
    if (!seasonUrls[s]) continue;
    logTo("scrapeLog", `📺 T${s}: ${seasonUrls[s]}`, "title");
    let ep = 1, fails = 0;
    while (ep <= 200) {
      const epUrl = `${seasonUrls[s]}/${ep}`;
      try {
        const res = await fetchWithProxy(epUrl); if (!res) { fails++; if (fails >= 3) break; continue; }
        const html = await res.text(); if (html.match(/<title>.*404.*<\/title>/i)) break;
        const v = extrairVideoDoHtml(html, epUrl); let fu = rawOf(v.url); if (shouldPrefix) fu = PREFIX + fu;
        let so = work.find(x => x.number === s); if (!so) { so = { number: s, label: `Temporada ${s}`, episodes: [] }; work.push(so); }
        const eo = so.episodes.find(x => x.number === ep);
        if (eo) eo.source = fu; else so.episodes.push({ number: ep, label: `Episódio ${ep}`, title: "", source: fu, subtitles: {} });
        total++; logTo("scrapeLog", `✔️ T${s} E${ep} [${v.tipo}]`, "success"); fails = 0; ep++; await sleep(150);
      } catch (e) { break; }
    }
  }
  if (total > 0) {
    work.sort((a, b) => a.number - b.number); work.forEach(s => s.episodes.sort((a, b) => a.number - b.number));
    try { await commitCatalog(`Scrape ${item.title}`, cat => { bucketOf(cat, kind)[id].seasons = work; }); toast(`✔️ ${total} episódios encontrados e salvos`); logTo("scrapeLog", `✅ FIM! ${total} eps salvos`, "success"); }
    catch (e) { toast("Erro ao salvar: " + e.message, true); logTo("scrapeLog", "❌ " + e.message, "error"); }
  } else toast("Nenhum episódio encontrado", true);
  btn.disabled = false; btn.innerHTML = "🕷️ Varrer Tudo";
}

async function addAutoUqload() {

  if (!url) return toast("Cole a URL do Uqload", true); if (!tmdbId) return toast("Informe o ID do TMDB", true);

  if (autoSources.some(s => s.uqloadUrl === url && s.tmdbId === tmdbId)) return toast("Já existe essa fonte monitorada", true);
  const src = { id: "auto_" + Date.now(), uqloadUrl: url, tmdbId, type, interval: autoIntervalDefault, prefix, timerId: null, lastRun: 0, nextRun: 0, currentLink: null, status: "pending" };
  autoSources.push(src); saveAutoSources(); renderAutoList();

function startTimerForSource(src) {
  if (src.timerId) clearInterval(src.timerId);
  const ms = src.interval * 60000;
  const next = () => { src.nextRun = Date.now() + ms; saveAutoSources(); updateCountdownUI(src); };
  next();
  src.timerId = setInterval(async () => { if (Date.now() >= src.nextRun) { await runAutoRefresh(src); next(); } else updateCountdownUI(src); }, 1000);
}
function updateCountdownUI(src) {
  const el = document.querySelector(`.auto-item[data-id="${src.id}"] .ai-countdown`); if (!el) return;
  el.textContent = Math.max(0, Math.ceil((src.nextRun - Date.now()) / 1000)) + "s";
}
async function runAutoRefresh(src) {
  logTo("autoLog", `🔄 Atualizando ID ${src.tmdbId}...`, "title"); src.status = "checking"; renderAutoList();
  try {
    let html = null;
    for (let i = 0; i < PROXIES.length; i++) {
      const idx = (currentProxyForAuto + i) % PROXIES.length, proxy = PROXIES[idx];
      try {
        const c = new AbortController(), to = setTimeout(() => c.abort(), 12000);
        const res = await fetch(proxy.url + encodeURIComponent(src.uqloadUrl), { headers: { Accept: "text/html" }, signal: c.signal });
        clearTimeout(to); if (res.ok) { html = await res.text(); currentProxyForAuto = idx; logTo("autoLog", `✓ Proxy ${proxy.name} respondeu`, "success"); break; }
      } catch (e) {}
    }
    if (!html) throw new Error("Todos os proxies falharam");
    const ex = extrairVideoDoHtml(html, src.uqloadUrl); logTo("autoLog", `✓ Extraído via: ${ex.tipo}`, "success");
    const link = buildFinalUrl(ex.url, src.prefix); src.currentLink = link; src.status = "active"; src.lastRun = Date.now();
    logTo("autoLog", `🔗 Link: ${link.slice(0, 80)}...`, "success");
    await saveAutoToCatalog(src, link); renderAutoList();
  } catch (err) { src.status = "error"; logTo("autoLog", `❌ Erro: ${err.message}`, "error"); renderAutoList(); }
}
async function saveAutoToCatalog(src, link) {
  if (!getGithubConfig()) { logTo("autoLog", "⚠ GitHub não configurado - link não salvo", "warn"); return; }
  try {
    await commitCatalog(`Auto-refresh ${src.tmdbId} (${new Date().toLocaleTimeString()})`, cat => {
      const bkt = bucketOf(cat, src.type);
      if (src.type === "movie") { if (!bkt[src.tmdbId]) bkt[src.tmdbId] = { addedAt: Date.now() }; bkt[src.tmdbId].source = link; bkt[src.tmdbId].lastAutoUpdate = new Date().toISOString(); }
      else {
        if (!bkt[src.tmdbId]) bkt[src.tmdbId] = { seasons: [], addedAt: Date.now() };
        if (!bkt[src.tmdbId].seasons) bkt[src.tmdbId].seasons = [];
        let s1 = bkt[src.tmdbId].seasons.find(x => x.number === 1);
        if (!s1) { s1 = { number: 1, label: "Temporada 1", episodes: [] }; bkt[src.tmdbId].seasons.push(s1); }
        let e1 = s1.episodes.find(x => x.number === 1);
        if (!e1) s1.episodes.push({ number: 1, label: "Episódio 1", source: link }); else e1.source = link;
      }
    });
    logTo("autoLog", `✅ Salvo no catalog.json (ID ${src.tmdbId})`, "success");

    <div class="card"><div class="cardhead"><span class="icobox">${ic("link", 22)}</span><div><h2>Prefixos de link</h2><div class="muted" style="font-size:.8rem">O prefixo padrão é usado em todos os links novos. Cadastre outros para quando um cair.</div></div></div>
      ${list.map((p, i) => { const on = p.url === active; return `<div class="eprow"><button class="ib" title="${on ? "Prefixo padrão" : "Usar como padrão"}" style="${on ? "color:#34d399;border-color:rgba(16,185,129,.4)" : ""}" onclick="setActivePrefix(${i})">${ic(on ? "checkc" : "check", 17)}</button><div style="flex:1;min-width:0"><b>${esc(p.name)}</b> ${on ? '<span class="tag m">PADRÃO</span>' : ""}<div class="muted" style="font-size:.74rem;word-break:break-all">${esc(p.url)}</div></div>${st ? `<span class="muted" style="font-size:.78rem;white-space:nowrap">${(st[p.url] || 0).toLocaleString("pt-BR")} links</span>` : ""}<button class="ib dng" title="Remover" onclick="delPrefix(${i})">${ic("trash", 16)}</button></div>`; }).join("")}
      <div class="subbox"><h3>Adicionar prefixo</h3><div class="row"><div style="flex:1"><label>Nome</label><input id="pfxName" placeholder="ex: mgeb novo"></div><div style="flex:2"><label>URL do prefixo</label><input id="pfxUrl" placeholder="https://dominio.com/mp4.php?url="></div></div><button class="btn mt" onclick="addPrefix()">${ic("plus", 16)} Adicionar prefixo</button></div></div>
    <div class="card"><div class="cardhead"><span class="icobox">${ic("swap", 22)}</span><div><h2>Trocar prefixo em todos os filmes e séries</h2><div class="muted" style="font-size:.8rem">Troca o prefixo de todos os links do catálogo (filmes, séries e animes) pelo prefixo escolhido.</div></div></div>
      <div class="field"><label>Novo prefixo</label><select id="pfxTarget">${list.map(p => `<option value="${esc(p.url)}" ${p.url === active ? "selected" : ""}>${esc(p.name)} — ${esc(shortLink(p.url, 40))}</option>`).join("")}</select></div>
      <label class="switchrow" style="margin-top:0"><input type="checkbox" id="pfxAddMissing"><b style="font-weight:600;font-size:.84rem">Também colocar o prefixo nos links que estão sem prefixo (link direto)</b></label>
      ${st ? `<div class="hint">Links sem prefixo hoje: ${st.none.toLocaleString("pt-BR")}</div>` : ""}
      <button class="btn block mt" id="btnPfxAll" ${can ? "" : "disabled"} onclick="replaceAllPrefixes()">🔁 Trocar prefixo em tudo</button>
      ${can ? "" : `<div class="hint center">Liberado só quando o GitHub estiver conectado. Configure em <a href="#account" onclick="go('account');return false" style="color:#f87171">Minha Conta</a>.</div>`}</div>`;
}
function saveSite() { try { localStorage.setItem("kiraflix_site", JSON.stringify({ name: $("siName").value.trim(), url: $("siUrl").value.trim() })); toast("✔ Salvo"); } catch (e) { toast("Não consegui salvar", true); } }
function openSite() { const u = $("siUrl").value.trim(); if (!u) return toast("Informe o endereço do site", "warn"); window.open(u.startsWith("http") ? u : "https://" + u, "_blank", "noopener"); }
function addPrefix() {
  const name = $("pfxName").value.trim(), url = $("pfxUrl").value.trim();
  if (!/^https?:\/\/\S+$/i.test(url)) return toast("Coloque a URL completa do prefixo (https://...)", true);
  const list = getPrefixList();
  if (list.some(p => p.url === url)) return toast("Esse prefixo já está na lista", true);
  list.push({ name: name || url.replace(/^https?:\/\//, "").split("/")[0], url });
  setPrefixList(list); toast("✔ Prefixo adicionado"); renderMySite();
}
function setActivePrefix(i) {
  const p = getPrefixList()[i]; if (!p) return;
  try { localStorage.setItem("kiraflix_prefix_active", p.url); } catch (e) {}
  PREFIX = p.url; refreshPrefixUI(); toast("✔ Prefixo padrão: " + p.name); renderMySite();
}
async function delPrefix(i) {
  const list = getPrefixList();
  if (list.length <= 1) return toast("Precisa sobrar pelo menos um prefixo", "warn");
  const p = list[i];
  if (!await askConfirm("Remover prefixo?", `“${p.name}” sai da lista. Links que ainda usam esse prefixo passam a ser tratados como link sem prefixo — troque-os antes se precisar.`, "Remover")) return;
  list.splice(i, 1); setPrefixList(list);
  if (PREFIX === p.url) { PREFIX = list[0].url; try { localStorage.setItem("kiraflix_prefix_active", PREFIX); } catch (e) {} refreshPrefixUI(); }
  renderMySite();
}
async function replaceAllPrefixes() {
  if (!getGithubConfig() || catalogReadOnly || !catalogLoaded) return toast("Conecte o GitHub em Minha Conta", "warn");
  const target = $("pfxTarget").value, addMissing = $("pfxAddMissing").checked;
  const name = (getPrefixList().find(p => p.url === target) || {}).name || target;
  const conv = x => { if (!x || typeof x !== "string") return x; if (!hasPrefix(x) && !addMissing) return x; return target + rawOf(x); };
  let n = 0;
  const walk = (cat, apply) => {
    for (const m of Object.values(cat.movies || {})) if (m.source) { const v = conv(m.source); if (v !== m.source) { n++; if (apply) m.source = v; } }
    for (const k of ["series", "animes"]) for (const sv of Object.values(cat[k] || {})) (sv.seasons || []).forEach(se => (se.episodes || []).forEach(e => { if (e.source) { const v = conv(e.source); if (v !== e.source) { n++; if (apply) e.source = v; } } }));
  };
  walk(catalog, false);
  if (!n) return toast("Nada para trocar — tudo já está nesse prefixo ✔", "info");
  if (!await askConfirm("Trocar prefixo em tudo?", `${n.toLocaleString("pt-BR")} links vão passar a usar “${name}”. O painel faz um backup local antes de salvar.`, "Trocar")) return;
  const b = $("btnPfxAll"); b.disabled = true; b.innerHTML = '<span class="spin"></span> Trocando';
  try {
    n = 0; await commitCatalog(`Troca prefixo para ${name}`, cat => walk(cat, true));
    toast(`✔ ${n.toLocaleString("pt-BR")} links trocados para ${name}`); renderMySite();
  } catch (e) { toast("Erro: " + e.message, true); b.disabled = false; b.innerHTML = "🔁 Trocar prefixo em tudo"; }
}

// ============================================================
// SAÚDE
// ============================================================
function fixDup(v) { if (typeof v !== "string") return v; const p = allPrefixes().find(x => v.startsWith(x)); return p ? p + rawOf(v) : v; }
function hasDupDeep(o) { if (typeof o === "string") return fixDup(o) !== o; if (Array.isArray(o)) return o.some(hasDupDeep); if (o && typeof o === "object") return Object.values(o).some(hasDupDeep); return false; }
const INVIS = /[\u200B\u200C\u200E\u200F\u202A-\u202E\u2060\u2066-\u2069\uFEFF]/;
function renderHealth() {
  const sec = $("p-health");
  const head = `<div class="ph"><div><h1>Saúde do catálogo</h1><p>Procura filmes/episódios sem link, prefixos duplicados, caracteres invisíveis e capas faltando.</p></div></div>
    <div class="row nofl" style="margin-bottom:8px"><button class="btn" onclick="renderHealth()">${ic("search", 16)} Verificar agora</button><button class="btn ghost" id="btnFix" onclick="fixHealth()">🛠️ Corrigir automático</button><button class="btn ghost" onclick="downloadBackup()">💾 Backup local</button></div>`;
  if (!catalogLoaded) { sec.innerHTML = head + `<div class="empty"><div class="big">⏳</div>Carregando catálogo…</div>`; return; }
  const noSrcM = [], noSrcS = [], emptyS = [], dup = [], invis = [], noPoster = [];
  for (const [id, m] of Object.entries(catalog.movies)) {
    if (!m.source) noSrcM.push({ kind: "movie", id, t: m.title }); if (!m.poster) noPoster.push({ kind: "movie", id, t: m.title });
    if (m.source && fixDup(m.source) !== m.source) dup.push({ kind: "movie", id, t: m.title }); if (INVIS.test(JSON.stringify(m))) invis.push({ kind: "movie", id, t: m.title });
  }
  for (const kind of ["series", "anime"]) for (const [id, s] of Object.entries(bucketOf(catalog, kind))) {
    const st = statusOf(kind, s);
    if (!(s.seasons || []).length) emptyS.push({ kind, id, t: s.title }); else if (st.withSrc < st.total) noSrcS.push({ kind, id, t: `${s.title} — ${st.withSrc}/${st.total} eps` });
    if (!s.poster) noPoster.push({ kind, id, t: s.title }); const js = JSON.stringify(s);
    if (hasDupDeep(s)) dup.push({ kind, id, t: s.title }); if (INVIS.test(js)) invis.push({ kind, id, t: s.title });
  }
  const groups = [["🎬", "Filmes sem link", "Abra e cole o link do vídeo", noSrcM], ["📺", "Séries/animes com episódios sem link", "Use o aplicar em massa para completar", noSrcS], ["🗂️", "Séries sem temporadas", "Abra e use Verificar novos episódios", emptyS], ["🔁", "Links com prefixo duplicado", "Corrigível automaticamente", dup], ["👻", "Caracteres invisíveis", "Corrigível automaticamente", invis], ["🖼️", "Sem capa (poster)", "Busque o ID de novo para puxar do TMDB", noPoster]];
  sec.innerHTML = head + groups.map(([i, t, s, a]) => `<div class="hcard ${a.length ? "bad" : "ok"}"><div class="hi">${i}</div><div class="ht"><b>${t}</b><div>${a.length ? s : "Tudo certo por aqui ✔"}</div></div><div class="hn">${a.length}</div></div>${a.length ? `<details><summary>Ver lista (${Math.min(a.length, 80)}${a.length > 80 ? " de " + a.length : ""})</summary><div class="hlist">${a.slice(0, 80).map(x => `<button onclick="openEditor('${x.kind}','${esc(x.id)}')"><span>${esc(x.t || x.id)}</span><span class="muted">#${esc(x.id)}</span></button>`).join("")}</div></details>` : ""}`).join("");
}
async function fixHealth() {
  await ensureCatalog(); if (catalogReadOnly) return toast("Configure o GitHub para corrigir", "warn");
  const b = $("btnFix"); b.disabled = true; let n = 0;
  try {
    await commitCatalog("Corrige links duplicados e caracteres invisíveis", cat => {
      const fix = o => { if (Array.isArray(o)) o.forEach(fix); else if (o && typeof o === "object") for (const k of Object.keys(o)) { if (typeof o[k] === "string") { const v = fixDup(o[k]).replace(/[\u200B\u200C\u200E\u200F\u202A-\u202E\u2060\u2066-\u2069\uFEFF]/g, ""); if (v !== o[k]) { o[k] = v; n++; } } else fix(o[k]); } };
      fix(cat);
    });
    toast(n ? `🛠️ ${n} campos corrigidos` : "Nada para corrigir ✔");
  } catch (e) { toast("Erro: " + e.message, true); }
  finally { b.disabled = false; }
}

// ============================================================
// MINHA CONTA (local) + LOGIN
// ============================================================
async function hashPw(p) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("kiraflix:" + p)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { return "b64:" + btoa(unescape(encodeURIComponent("kiraflix:" + p))); }
}
const getAcc = () => { try { return JSON.parse(localStorage.getItem("kiraflix_account") || "{}"); } catch (e) { return {}; } };
const putAcc = a => { try { localStorage.setItem("kiraflix_account", JSON.stringify(a)); return true; } catch (e) { return false; } };
function applyUser() {
  const a = getAcc(), nm = a.email ? a.email.split("@")[0] : "Admin";
  $("userName").textContent = nm; $("avSide").textContent = $("avTop").textContent = (nm[0] || "A").toUpperCase();
}
function renderAccount() {
  const a = getAcc(), gh = getGithubConfig() || {};
  $("p-account").innerHTML = `<div class="ph"><div><h1>Minha Conta</h1><p>Gerencie suas credenciais de acesso.</p></div></div>
    <div class="card"><div class="cardhead"><span class="icobox">${ic("git", 22)}</span><div style="flex:1"><h2>GitHub (salvar catálogo)</h2><div class="muted" style="font-size:.8rem">O painel salva o catalog.json direto no seu repositório. A configuração fica só neste navegador.</div></div><span class="pill ${gh.token ? "ok" : "warn"}" style="margin-left:auto">${gh.token ? "Configurado" : "Pendente"}</span></div>
      <div class="row"><div><label>Usuário/Org</label><input id="ghOwner" placeholder="ex: joaosilva" value="${esc(gh.owner || "")}" autocomplete="off"></div><div><label>Repositório</label><input id="ghRepo" placeholder="ex: kiraflix" value="${esc(gh.repo || "")}" autocomplete="off"></div></div>
      <div class="field mt fld-eye"><label>Personal Access Token (repo)</label><input id="ghToken" type="password" placeholder="ghp_..." value="${esc(gh.token || "")}" autocomplete="off"><button class="btn ghost sm" onclick="const i=$('ghToken');i.type=i.type==='password'?'text':'password'">${ic("eye", 16)}</button></div>
      <div class="row nofl mt"><button class="btn" onclick="saveGithubConfig()">💾 Salvar configuração</button><button class="btn ghost" id="btnTest" onclick="testGithubConnection()">${ic("check", 16)} Testar conexão</button></div>
      <div class="hint">✔ Antes de salvar, o painel relê o catálogo do GitHub e só altera o item mexido. ✔ Se o salvamento fosse apagar itens, ele cancela. ✔ Backup local antes de cada salvamento.</div></div>
    <div class="card"><div class="cardhead"><span class="icobox">${ic("mail", 24)}</span><h2>Alterar E-mail</h2></div>
      <div class="field"><label>E-mail Atual</label><input readonly value="${esc(a.email || "")}" placeholder="(nenhum definido)"></div>
      <div class="field"><label>Novo E-mail</label><input id="acNewMail" type="email" placeholder="novo@email.com"></div>
      <div class="field"><label>Sua Senha Atual (para confirmar)</label><input id="acPw1" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn block" onclick="accMail()">Atualizar E-mail</button></div>
    <div class="card"><div class="cardhead"><span class="icobox">${ic("lock", 24)}</span><h2>Alterar Senha</h2></div>
      <div class="field"><label>Senha Atual</label><input id="acPw2" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="field"><label>Nova Senha</label><input id="acNew" type="password" placeholder="Min. 6 caracteres" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar Nova Senha</label><input id="acNew2" type="password" placeholder="Repita a nova senha" autocomplete="new-password"></div>
      <button class="btn block" onclick="accPw()">Atualizar Senha</button>
      <p class="hint">Conta local deste navegador: depois de definir uma senha, o painel passa a pedir login ao abrir.</p></div>`;
}
async function accCheck(pw) { const a = getAcc(); if (!a.hash) return true; return (await hashPw(pw)) === a.hash; }
async function accMail() {
  const m = $("acNewMail").value.trim(); if (!/^\S+@\S+\.\S+$/.test(m)) return toast("E-mail inválido", true);
  if (!await accCheck($("acPw1").value)) return toast("Senha atual incorreta", true);
  const a = getAcc(); a.email = m; if (putAcc(a)) { toast("✔ E-mail atualizado"); applyUser(); renderAccount(); } else toast("Não consegui salvar", true);
}
async function accPw() {
  const n = $("acNew").value, n2 = $("acNew2").value;
  if (n.length < 6) return toast("A nova senha precisa ter ao menos 6 caracteres", true);
  if (n !== n2) return toast("As senhas não conferem", true);
  if (!await accCheck($("acPw2").value)) return toast("Senha atual incorreta", true);
  const a = getAcc(); a.hash = await hashPw(n); if (putAcc(a)) { try { sessionStorage.setItem("kf_ok", "1"); } catch (e) {} toast("✔ Senha atualizada"); renderAccount(); } else toast("Não consegui salvar", true);
}
async function doLogin() {
  const a = getAcc();
  if (a.email && $("lgEmail").value.trim().toLowerCase() !== a.email.toLowerCase()) return toast("E-mail ou senha incorretos", true);
  if (!await accCheck($("lgPass").value)) return toast("E-mail ou senha incorretos", true);
  try { sessionStorage.setItem("kf_ok", "1"); } catch (e) {} $("login").classList.add("hidden");
}
function checkLogin() {
  const a = getAcc(); let ok = false; try { ok = sessionStorage.getItem("kf_ok") === "1"; } catch (e) {}
  if (a.hash && !ok) { $("login").classList.remove("hidden"); $("lgEmail").value = a.email || ""; }
  $("lgPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
document.addEventListener("DOMContentLoaded", () => {
  buildNav(); applyUser(); checkLogin();
  try { autoSources = JSON.parse(localStorage.getItem("kiraflix_auto_uqload") || "[]").map(s => ({ ...s, timerId: null })); } catch (e) { autoSources = []; }
  const h = (location.hash || "").replace("#", "");
  go(RENDER[h] && h !== "edit" ? h : "dashboard");
  reloadCatalog(false);
  if (autoSources.length) { renderAutomate(); autoSources.forEach(s => startTimerForSource(s)); renderAutoList(); }
  setInterval(() => autoSources.forEach(s => { if (s.nextRun > 0) updateCountdownUI(s); }), 1000);
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && curPage === "edit" && ed) { e.preventDefault(); edSave(ed.tab === 1); }
    if (e.key === "Escape") { closeModal(); toggleMenu(false); }
  });
});
</script>
</body>
</html>
